<html lang="en">
<head>

<title>AK Quiz Night</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap');

  :root {

    --glass-border: rgba(255, 255, 255, 0.08);
    --gold: #ffc82a;
    --gold-glow: rgba(255, 200, 42, 0.35);
    --cyan: #00f0ff;
    --cyan-glow: rgba(0, 240, 255, 0.35);
    --red: #ff2a55;
    --red-glow: rgba(255, 42, 85, 0.35);
    --green: #10b981;
    --green-glow: rgba(16, 185, 129, 0.35);
    --purple: #a855f7;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --radius-lg: 20px;
    --radius-md: 14px;
    --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(--font-family);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-midnight);
    background-image: 
      radial-gradient(circle at 50% -10%, rgba(255, 200, 42, 0.15) 0%, transparent 60%),
      radial-gradient(circle at 50% 110%, rgba(168, 85, 247, 0.12) 0%, transparent 60%);
    color: var(--text-main);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    min-height: 100dvh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: clamp(12px, 3vw, 20px);
    overflow-y: auto;
    background: rgba(7, 9, 19, 0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 1px var(--glass-border);
  }

  h1 {
    font-size: clamp(22px, 7vw, 30px);
    margin: 0;
    line-height: 1;
    font-weight: 900;
    background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .z {
    color: var(--gold);
    background: rgba(255, 200, 42, 0.15);
    border: 1px solid var(--gold-glow);
    padding: 2px 8px;
    border-radius: 8px;
    -webkit-text-fill-color: var(--gold);
  }

  .sub {
    color: var(--text-muted);
    font-size: clamp(10px, 2.9vw, 12px);
    margin-top: 6px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 800;
  }

  .home-hero {
    text-align: center;
    padding: clamp(12px, 4vw, 24px) 0 8px;
  }

  .bolt {
    font-size: clamp(36px, 11vw, 56px);
    line-height: 1;
    filter: drop-shadow(0 0 20px var(--gold-glow));
  }

  .card {
    background: var(--glass-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: clamp(14px, 3.5vw, 20px);
    margin-top: clamp(8px, 2vw, 14px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  }

  label {
    display: block;
    font-weight: 800;
    font-size: clamp(10px, 2.9vw, 12px);
    margin: 0 0 6px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
  }

  input {
    width: 100%;
    font-size: clamp(15px, 4.4vw, 18px);
    padding: clamp(10px, 2.5vw, 14px);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius-md);
    background: rgba(11, 14, 20, 0.6);
    font-family: inherit;
    font-weight: 800;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    outline: none;
    transition: all 0.2s ease;
  }

  input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 20px var(--gold-glow);
    background: rgba(11, 14, 20, 0.85);
  }

  .btn {
    touch-action: manipulation;
    width: 100%;
    border: none;
    border-radius: var(--radius-md);
    padding: clamp(12px, 2.8vw, 15px);
    font-size: clamp(13px, 3.6vw, 15px);
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    margin-top: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: transform 0.12s ease;
    background: linear-gradient(135deg, var(--gold) 0%, #e6a800 100%);
    color: #07090e;
    box-shadow: 0 8px 20px var(--gold-glow);
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  
  .btn-gold { background: linear-gradient(135deg, var(--gold) 0%, #e6a800 100%); color: #07090e; }
  .btn-teal { background: linear-gradient(135deg, var(--cyan) 0%, #0284c7 100%); color: #07090e; box-shadow: 0 8px 20px var(--cyan-glow); }
  .btn-cerise { background: linear-gradient(135deg, var(--red) 0%, #dc2626 100%); color: #fff; box-shadow: 0 8px 20px var(--red-glow); }
  .btn-ghost { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--glass-border); box-shadow: none; }
  .btn-sm { padding: clamp(8px, 2vw, 10px) 14px; font-size: clamp(11px, 3vw, 13px); margin-top: 0; width: auto; }

  .row { display: flex; gap: 8px; }
  .row .btn { margin-top: 0; }

  .divider { text-align: center; font-size: 11px; margin: 12px 0 4px; font-weight: 800; letter-spacing: 2px; color: var(--text-muted); }
  .tag { display: inline-block; background: rgba(255, 200, 42, 0.15); color: var(--gold); border: 1px solid var(--gold-glow); font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; }
  .hint { font-size: clamp(10px, 2.9vw, 12px); color: var(--text-muted); margin-top: 8px; line-height: 1.45; }

  .cat-chip { display: inline-block; font-size: clamp(9px, 2.7vw, 11px); font-weight: 800; padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); background: rgba(255, 200, 42, 0.15); border: 1px solid var(--gold-glow); }

  .qbox { background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: clamp(14px, 3.5vw, 20px); margin-top: clamp(8px, 2vw, 12px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
  .qnum { font-size: clamp(9px, 2.7vw, 11px); color: var(--text-muted); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
  .qtext { font-size: clamp(16px, 4.8vw, 22px); font-weight: 800; line-height: 1.3; margin-top: 8px; color: #fff; }

  .buzzer { margin-top: auto; padding: clamp(12px, 3vw, 20px) 0 6px; display: flex; justify-content: center; }
  .bz { touch-action: manipulation; width: min(100%, 32vh); aspect-ratio: 1/1; border-radius: 50%; border: 3px solid var(--gold); background: linear-gradient(135deg, rgba(255, 200, 42, 0.2), rgba(255, 200, 42, 0.05)); color: var(--gold); font-size: clamp(28px, 9vw, 44px); font-weight: 900; letter-spacing: 2px; box-shadow: 0 0 30px var(--gold-glow); cursor: pointer; transition: transform 0.1s ease; }
  .bz:active { transform: scale(0.94); }
  .bz.locked { border-color: var(--text-muted); background: rgba(255, 255, 255, 0.05); color: var(--text-muted); box-shadow: none; cursor: default; }
  .bz.mine { border-color: var(--green); background: rgba(16, 185, 129, 0.2); color: var(--green); box-shadow: 0 0 30px var(--green-glow); }

  .status { text-align: center; font-size: clamp(12px, 3.6vw, 15px); font-weight: 800; margin-top: 10px; min-height: 20px; color: var(--text-muted); }

  .modbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .pin { font-size: clamp(18px, 6vw, 24px); font-weight: 900; letter-spacing: 3px; color: var(--gold); text-shadow: 0 0 15px var(--gold-glow); }

  .ans { background: rgba(16, 185, 129, 0.12); border: 1.5px solid var(--green); border-radius: var(--radius-md); padding: clamp(10px, 2.8vw, 14px); margin-top: 10px; }
  .ans-label { font-size: clamp(9px, 2.6vw, 11px); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
  .ans-text { font-size: clamp(15px, 4.6vw, 20px); font-weight: 900; margin-top: 4px; color: var(--green); }

  .buzzed { background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: clamp(12px, 3vw, 16px); margin-top: 10px; text-align: center; }
  .buzzed .who { font-size: clamp(18px, 5.6vw, 24px); font-weight: 900; color: #fff; }
  .buzzed.none { background: transparent; color: var(--text-muted); border-style: dashed; }

  .scores { margin-top: 12px; }
  .srow { display: flex; align-items: center; justify-content: space-between; background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: clamp(8px, 2.2vw, 12px) 14px; margin-bottom: 8px; font-weight: 800; font-size: clamp(12px, 3.6vw, 15px); }
  .srow .pts { background: rgba(255, 200, 42, 0.15); color: var(--gold); border: 1px solid var(--gold-glow); border-radius: 20px; padding: 2px 12px; min-width: 44px; text-align: center; }

  .qprog { font-size: clamp(9px, 2.6vw, 11px); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; margin-top: 4px; color: var(--text-muted); }
  .mini { font-size: clamp(10px, 2.9vw, 12px); color: var(--text-muted); text-align: center; margin-top: 8px; }
  .pill-live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--green); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green-glow); animation: pl 1s infinite; }
  @keyframes pl { 50% { opacity: 0.3; } }

  .center { text-align: center; }
  .backlink { background: none; border: none; color: var(--text-muted); font-weight: 800; font-size: clamp(11px, 3.2vw, 13px); cursor: pointer; padding: 8px; font-family: inherit; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(18, 24, 38, 0.95); border: 1.5px solid var(--glass-border); color: #fff; padding: 12px 20px; border-radius: 30px; font-weight: 800; font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50; max-width: 90%; text-align: center; backdrop-filter: blur(16px); }
  .toast.show { opacity: 1; }

  .conn { position: fixed; top: 10px; right: 10px; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 20px; background: rgba(18, 24, 38, 0.8); border: 1px solid var(--glass-border); color: var(--text-muted); z-index: 40; }
  .conn.ok { border-color: var(--green); color: var(--green); }

  .timer { margin-top: 10px; text-align: center; }
  .timer-num { font-size: clamp(24px, 8vw, 36px); font-weight: 900; line-height: 1; color: var(--gold); }
  .timer-num.warn { color: var(--red); animation: pl 0.5s ease-in-out infinite; }
  .timer-bar { height: 6px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); margin-top: 6px; overflow: hidden; }
  .timer-fill { height: 100%; background: var(--gold); width: 100%; border-radius: 10px; transition: width 0.2s linear; }
  .timer-fill.warn { background: var(--red); }
  .timer-label { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }

  .rank-hero { text-align: center; padding: 12px 0 4px; }
  .rank-hero .trophy { font-size: clamp(36px, 10vw, 56px); filter: drop-shadow(0 0 20px var(--gold-glow)); }
  .rank-row { display: flex; align-items: center; gap: 12px; background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: clamp(10px, 2.5vw, 14px) 16px; margin-bottom: 8px; }
  .rank-pos { font-size: clamp(15px, 4.8vw, 20px); font-weight: 900; min-width: 32px; text-align: center; color: var(--text-muted); }
  .rank-name { flex: 1; font-weight: 800; font-size: clamp(14px, 4vw, 17px); color: #fff; }
  .rank-pts { background: rgba(255, 200, 42, 0.15); color: var(--gold); border: 1px solid var(--gold-glow); border-radius: 20px; padding: 4px 14px; font-weight: 900; font-size: clamp(12px, 3.6vw, 15px); }
  .you-badge { font-size: 9px; font-weight: 800; background: var(--gold); color: #07090e; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }

  .result-banner { border: 1.5px solid var(--glass-border); border-radius: var(--radius-lg); padding: clamp(14px, 4vw, 22px); text-align: center; margin-top: 12px; background: var(--glass-card); }
  .result-correct { border-color: var(--green); background: rgba(16, 185, 129, 0.12); }
  .result-wrong { border-color: var(--red); background: rgba(255, 42, 85, 0.12); }
  .result-emoji { font-size: clamp(32px, 10vw, 48px); line-height: 1; }
  .result-text { font-size: clamp(18px, 5.4vw, 24px); font-weight: 900; margin-top: 6px; color: #fff; }
  .result-sub { font-size: clamp(11px, 3.4vw, 13px); font-weight: 700; color: var(--text-muted); margin-top: 4px; }

  .getready { text-align: center; padding: clamp(16px, 5vw, 32px) 12px; }
  .getready .big { font-size: clamp(32px, 11vw, 48px); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 1px solid var(--glass-border); background: rgba(11, 14, 20, 0.6); border-radius: 20px; padding: clamp(6px, 1.8vw, 8px) clamp(10px, 2.5vw, 14px); font-size: clamp(11px, 2.8vw, 13px); font-weight: 800; font-family: inherit; cursor: pointer; color: var(--text-muted); transition: all 0.15s ease; }
  .chip.on { background: var(--gold); color: #07090e; border-color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }
  
  .seg { display: flex; gap: 8px; margin-top: 8px; }
  .seg .segbtn { flex: 1; border: 1px solid var(--glass-border); background: rgba(11, 14, 20, 0.6); border-radius: var(--radius-md); padding: clamp(8px, 2vw, 12px) 8px; font-weight: 900; font-family: inherit; font-size: clamp(11px, 3.2vw, 13px); cursor: pointer; color: var(--text-muted); transition: all 0.15s ease; }
  .seg .segbtn.on { background: var(--gold); color: #07090e; border-color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }
  .seg .segbtn small { display: block; font-weight: 700; font-size: clamp(8px, 2.3vw, 10px); opacity: 0.75; margin-top: 2px; text-transform: none; }

  .opts { display: flex; flex-direction: column; gap: clamp(6px, 1.8vw, 10px); margin-top: clamp(8px, 2vw, 12px); }
  .optbtn { width: 100%; border: 1.5px solid var(--glass-border); background: var(--glass-card); border-radius: var(--radius-md); padding: clamp(12px, 2.8vw, 15px); font-size: clamp(14px, 3.8vw, 16px); font-weight: 800; font-family: inherit; text-align: left; cursor: pointer; color: #fff; transition: all 0.15s ease; display: flex; align-items: center; gap: 12px; }
  .optbtn:active { transform: scale(0.98); }
  .optbtn .letter { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); width: 28px; height: 28px; min-width: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; }
  .optbtn.picked { border-color: var(--gold); background: rgba(255, 200, 42, 0.15); }
  .optbtn.picked .letter { background: var(--gold); color: #07090e; }
  .optbtn.correct { border-color: var(--green); background: rgba(16, 185, 129, 0.2); }
  .optbtn.correct .letter { background: var(--green); color: #fff; }
  .optbtn.wrongpick { border-color: var(--red); background: rgba(255, 42, 85, 0.2); }
  .optbtn.wrongpick .letter { background: var(--red); color: #fff; }

  .loading { text-align: center; padding: 30px 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255, 200, 42, 0.2); border-top-color: var(--gold); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .srcbadge { display: inline-block; font-size: 9px; font-weight: 800; padding: 3px 10px; border-radius: 20px; background: rgba(255, 200, 42, 0.15); border: 1px solid var(--gold-glow); color: var(--gold); letter-spacing: 1px; }
</style>

const POOL_CS={}, POOL_S={};
ALL.forEach(x=>{
  (POOL_CS[x.c+'|'+x.t]=POOL_CS[x.c+'|'+x.t]||new Set()).add(x.a);
  (POOL_S[x.t]=POOL_S[x.t]||new Set()).add(x.a);
});
Object.entries(EXTRA).forEach(([k,list])=>{
  POOL_S[k]=POOL_S[k]||new Set();
  list.forEach(v=>POOL_S[k].add(v));
});
function optionsFor(idx){
  const x=ALL[idx];
  let pool=[...(POOL_CS[x.c+'|'+x.t]||new Set())].filter(v=>v!==x.a);
  if(pool.length<3) pool=[...(POOL_S[x.t]||new Set())].filter(v=>v!==x.a);
  const picked=[];
  const p=pool.slice();
  while(picked.length<3&&p.length) picked.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);
  while(picked.length<3) picked.push('—');
  return shuffle([x.a,...picked]);
}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(cats,n){
  const idxs=[];
  ALL.forEach((x,i)=>{ if(cats.includes(x.c)) idxs.push(i); });
  const sh=shuffle(idxs);
  if(!n||n<=0) return sh;
  return sh.slice(0,Math.min(n,sh.length));
}

let AC=null, soundReady=false;
function ensureAC(){
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return AC;
}
function unlockAudio(){
  const ac=ensureAC(); if(!ac) return;
  if(ac.state==='suspended'){ ac.resume(); }
  if(!soundReady){
    try{
      const b=ac.createBuffer(1,1,22050);
      const s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
      soundReady=true;
    }catch(e){}
  }
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, {passive:true});
});
function tone(freq,start,dur,vol,type){
  const ac=ensureAC(); if(!ac) return;
  if(ac.state==='suspended') ac.resume();
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq, ac.currentTime+start);
  const t=ac.currentTime+start;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.03);
}

/* ============ TIMER ============ */
let tickInterval=null,lastBeepSecond=null,playedTimeUp=false;
function timerStart(r){
  if(!r||!r.timeLimit) return null;
  if(r.online) return (r.phase==='question')?r.phaseAt:null;
  if(r.mode==='fff') return r.revealed?r.revealedAt:null;
  return r.buzzedAt||null;
}
function remainingSecs(r){
  const st=timerStart(r);
  if(!r||!r.started||!r.timeLimit||!st) return null;
  if(r.online) return (r.phase==='question')?Math.max(0,r.timeLimit-((serverNow()-st)/1000)):null;
  if(r.mode==='fff' && r.showAnswer) return null;
  if(r.mode!=='fff' && r.result) return null;
  return Math.max(0, r.timeLimit-((serverNow()-st)/1000));
}
function startTicking(){
  if(tickInterval) return;
  tickInterval=setInterval(()=>{
    const r=lastRoom;
    const rem=remainingSecs(r);
    if(rem===null){lastBeepSecond=null;playedTimeUp=false;return;}
    const whole=Math.ceil(rem);
    const win=(r.timeLimit<=5)?2:5;
    if(ME.role==='player'){
      const answered = r.mode==='fff' && answersObj(r)[ME.id];
      if(!answered){
        if(rem>0&&whole<=win&&whole!==lastBeepSecond){lastBeepSecond=whole;sBeep();}
        if(rem<=0&&!playedTimeUp){playedTimeUp=true;sTimeUp();}
      }
    }
    const h=document.getElementById('timerHolder');
    if(h) h.innerHTML=timerHTML(r);
  },250);
}
let uiTimer=null;
function startUITick(){
  if(uiTimer) return;
  uiTimer=setInterval(()=>{
    const r=lastRoom;
    if(!r||!r.online||r.finished){return;}
    if(r.phase==='countdown'||r.phase==='reveal') renderOnline(r);
  },500);
}
function stopUITick(){ if(uiTimer){clearInterval(uiTimer);uiTimer=null;} }
function stopTicking(){if(tickInterval){clearInterval(tickInterval);tickInterval=null;}lastBeepSecond=null;playedTimeUp=false;}
function timerHTML(r){
  const rem=remainingSecs(r);
  if(rem===null) return '';
  const warn=rem<=((r.timeLimit<=5)?2:5);
  const pct=Math.max(0,Math.min(100,(rem/r.timeLimit)*100));
  if(rem<=0) return `<div class="timer"><div class="timeup">⏰ Time's up!</div></div>`;
  return `<div class="timer">
    <div class="timer-label">Time to answer</div>
    <div class="timer-num ${warn?'warn':''}">${Math.ceil(rem)}s</div>
    <div class="timer-bar"><div class="timer-fill ${warn?'warn':''}" style="width:${pct}%"></div></div>
  </div>`;
}

const COUNTDOWN_S=3, REVEAL_S=5, BUZZ_ANSWER_S=10;

  const base = r.mode==='buzzer' ? (rank===0?10:0) : fffPointsFor(rank);
  return r.dbl ? base*2 : base;
}

async function claim(r){
  try{
    const res=await db.ref('rooms/'+ME.code+'/seq').transaction(cur=>{
      const now=(cur==null)?0:cur;
      if(now!==(r.seq||0)) return;
      return now+1;
    });
    return !!res.committed;
  }catch(e){ return false; }
}

async function engineTick(){
  const r=lastRoom;
  if(!r||!r.online||!r.started||r.finished||!r.phaseAt) return;
  maybeTopUp(r);
  const el=(serverNow()-r.phaseAt)/1000;
  const players=Object.keys(playersObj(r)).length;

  if(r.phase==='countdown'){
    if(el>=COUNTDOWN_S && await claim(r)) await onlineStartQuestion(r);
    return;
  }
  if(r.phase==='question'){
    if(r.mode==='buzzer'){
      if(r.buzzedBy){
        const since=(serverNow()-(r.buzzedAt||serverNow()))/1000;
        const answered=answersObj(r)[r.buzzedBy];
        if((answered||since>=BUZZ_ANSWER_S) && await claim(r)) await onlineEndQuestion(r);
      } else if(el>=r.timeLimit && await claim(r)){
        await onlineEndQuestion(r);
      }
    } else {
      const got=Object.keys(answersObj(r)).length;
      if((el>=r.timeLimit || (players>0&&got>=players)) && await claim(r)) await onlineEndQuestion(r);
    }
    return;
  }
  if(r.phase==='reveal'){
    if(el>=REVEAL_S && await claim(r)) await onlineNext(r);
  }
}

}

    }
  } else {
    const correct=Object.entries(ans).filter(([id,a])=>a.choice===q.a).sort((a,b)=>a[1].at-b[1].at);
    correct.forEach(([id],i)=>{
      const pts=pointsFor(r,i);
      if(pts>0) up['rooms/'+ME.code+'/scores/'+id]=(scoresObj(r)[id]||0)+pts;
    });
  }
  up['rooms/'+ME.code+'/showAnswer']=true;
  up['rooms/'+ME.code+'/phase']='reveal';
  up['rooms/'+ME.code+'/phaseAt']=firebase.database.ServerValue.TIMESTAMP;
  await db.ref().update(up);
}

let toppingUp=false;
async function maybeTopUp(r){
  if(toppingUp) return;
  if(!r||r.src!=='ai'||!r.openEnded||!r.aiQ) return;
  if(r.qIndex < r.aiQ.length-10) return;
  toppingUp=true;
  try{
    const more=await generateAI(r.topic,r.cats,30);
    if(more.length){
      const have=new Set(r.aiQ.map(x=>x.q.toLowerCase()));
      const fresh=more.filter(x=>!have.has(x.q.toLowerCase()));
      if(fresh.length) await db.ref('rooms/'+ME.code+'/aiQ').set(r.aiQ.concat(fresh));
    }
  }catch(e){ console.error('top-up failed',e); }
  toppingUp=false;
}

async function onlineNext(r){
  const nextI=r.qIndex+1;
  if(nextI>=deckLen(r)){
    if(r.openEnded && r.src==='ai'){ await maybeTopUp(r); }
    if(nextI>=deckLen(lastRoom||r)){ await db.ref('rooms/'+ME.code).update({finished:true}); return; }
  }
  await db.ref('rooms/'+ME.code).update({
    qIndex:nextI, phase:'countdown', phaseAt:firebase.database.ServerValue.TIMESTAMP,
    options:null, answers:null, showAnswer:false, revealed:false,
    dbl: !!(r.dblSet&&r.dblSet[nextI])
  });
}

/* ============ SYNC ============ */
function subscribeRoom(code){
  unsubscribeRoom();
  roomRef=db.ref('rooms/'+code);
  roomListener=roomRef.on('value',snap=>{
    const r=snap.val();
    if(!r){ if(ME.role==='player'){toast('Room closed by host');goHome();} return; }
    const prev=lastRoom;
    if(prev && (prev.qIndex!==r.qIndex || (prev.phase==='question'&&r.phase!=='question'))){
      myLockedSig=null; optimisticPick=null;
      const ln=document.getElementById('lockedNote'); if(ln) ln.remove();
    }
    lastRoom=r;
    if(ME.role==='player') playerTransitionSounds(prev,r);
    if(r.online && r.started && !r.finished){startEngine();startUITick();} else if(!r.online){stopEngine();stopUITick();}
    const st=timerStart(r);
    if(r.started&&r.timeLimit&&st){
      if(!prev||timerStart(prev)!==st){lastBeepSecond=null;playedTimeUp=false;}
      startTicking();
    } else stopTicking();
    if(r.online) renderOnline(r);
    else if(ME.role==='mod') renderMod(r); else renderPlayer(r);
  });
}

function unsubscribeRoom(){
  if(roomRef&&roomListener) roomRef.off('value',roomListener);
  if(masterPlayersRef) { masterPlayersRef.off(); masterPlayersRef = null; }
  if(roomConfigRef) { roomConfigRef.off(); roomConfigRef = null; }
  roomRef=null;roomListener=null;
}

function playerTransitionSounds(prev,r){
  if(!prev) return;
  if(!prev.dbl && r.dbl) sDouble();
  if(r.online){
    if(prev.phase!=='question' && r.phase==='question') sGo();
    if(prev.phase!=='reveal' && r.phase==='reveal'){
      const my=answersObj(r)[ME.id], q=currentQ(r);
      if(my && my.choice===q.a) sCorrect(); else sWrong();
    }
    return;
  }
  if(r.mode!=='fff'){
    if(!prev.result && r.result){ r.result.correct?sCorrect():sWrong(); }
  } else {
    if(!prev.showAnswer && r.showAnswer){
      const my=answersObj(r)[ME.id];
      const q=currentQ(r);
      if(my && my.choice===q.a) sCorrect(); else sWrong();
    }
  }
}

async function callGen(topic,cats,n,avoid){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),26000);
  try{
    const res=await fetch('/api/questions',{
      method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({topic:topic||'',categories:cats,count:n,avoid:avoid||[]})
    });
    clearTimeout(t);
    const txt=await res.text();
    let data={}; try{ data=JSON.parse(txt); }catch(_){ return []; }
    if(!res.ok){ return []; }
    return Array.isArray(data.questions)?data.questions:[];
  }catch(e){
    clearTimeout(t);
    return [];
  }
}

async function generateAI(topic,cats,count){
  aiError=null;
  const want=count>0?count:20;
  const have=[]; const seen=new Set();
  const absorb=list=>list.forEach(q=>{
    if(!q||!q.q||!q.a) return;
    const k=q.q.trim().toLowerCase();
    if(seen.has(k)) return;
    seen.add(k); have.push(q);
  });
  absorb(await callGen(topic,cats,want,[]));
  for(let round=0; have.length<want && round<2; round++){
    const need=want-have.length;
    const avoid=have.map(q=>q.q);
    const more=await callGen(topic,cats,need,avoid);
    if(!more.length) break;
    absorb(more);
  }
  return have.slice(0,want);
}
let aiError=null;

async function createRoom(forceBank){
  unlockAudio();
  let code=newCode();
  for(let i=0;i<4;i++){const s=await db.ref('rooms/'+code).get();if(!s.exists())break;code=newCode();}
  
  const openEnded = setupSel.count===0;
  let aiQ=null, usedSrc='bank';
  if(!forceBank){
    const n = openEnded ? 50 : setupSel.count;
    screenGenerating(setupSel.topic
      ? ('Writing '+n+' questions about '+setupSel.topic+'…')
      : ('Writing '+n+' questions…'));
    const gen=await generateAI(setupSel.topic,setupSel.cats,n);
    if(gen.length>=5){
      aiQ=gen; usedSrc='ai';
      if(!openEnded && aiQ.length<n){
        const cats = setupSel.cats.length?setupSel.cats:CATEGORIES;
        const extra=buildDeck(cats, n-aiQ.length).map(i=>({
          q:ALL[i].q, a:ALL[i].a, cat:ALL[i].c, opts:optionsFor(i)
        }));
        aiQ=aiQ.concat(extra).slice(0,n);
      }
    } else {
      // CLEAN FALLBACK: Seamlessly switch to offline QBANK without freeze or alert modal
      usedSrc='bank';
      toast('Gemini 3.6 unavailable. Loaded Offline Bank.');
    }
  }
  if(usedSrc==='bank' && (!setupSel.cats || !setupSel.cats.length)){ setupSel.cats=[...CATEGORIES]; }
  const deck=buildDeck(setupSel.cats.length ? setupSel.cats : CATEGORIES, setupSel.count);

  let tl=Math.min(30,Math.max(0,setupSel.time));
  if(setupSel.online && tl<5) tl=15;
  const effLen = aiQ ? aiQ.length : deck.length;
  const dblSet={};
  if(setupSel.dbl && setupSel.online){
    for(let i=0;i<effLen;i++){ if(Math.random()<0.2) dblSet[i]=true; }
  }
  const myId=setupSel.online?uid():'mod';
  const room={
    code,created:firebase.database.ServerValue.TIMESTAMP,
    hostName:setupSel.name, mode:setupSel.mode,
    online:!!setupSel.online, suspense:!!setupSel.suspense,
    dblEnabled:!!setupSel.dbl, dblSet, dbl:false, neg:setupSel.neg||0,
    engineId:setupSel.online?myId:null,
    phase:'countdown', phaseAt:null, seq:0,
    cats:setupSel.cats, timeLimit:tl,
    src:usedSrc, topic:setupSel.topic||null, aiQ:aiQ||null, openEnded,
    started:false,finished:false,qIndex:0,
    revealed:false,revealedAt:null,
    buzzedBy:null,buzzedAt:null,result:null,
    answers:null,showAnswer:false,options:null,
    players:{},scores:{},deck
  };
  if(setupSel.online){ room.players[myId]=setupSel.name; room.scores[myId]=0; }
  await db.ref('rooms/'+code).set(room);
  ME=setupSel.online
    ? {role:'player',name:setupSel.name,code,id:myId}
    : {role:'mod',name:setupSel.name,code,id:'mod'};
  subscribeRoom(code);
}

  if(r.mode==='buzzer'){

    const bName=buzzed?playersObj(r)[r.buzzedBy]:'';
    if(buzzed && mine && !my){
      app.innerHTML=`${qHead}
        <div id="timerHolder">${buzzTimerHTML(r)}</div>
        <div class="status">🎉 You buzzed first — pick your answer!</div>
        <div class="opts">

        </div>

      const el0=document.getElementById('qtext');

      document.querySelectorAll('.optbtn').forEach(b=>bindTap(b,()=>pickAnswer(b.dataset.o)));
      document.getElementById('leave').onclick=goHome;
      return;
    }
    let cls='bz',lab='BUZZ';
    if(buzzed&&mine){cls='bz mine';lab='YOU!';}
    else if(buzzed){cls='bz locked';lab='🔒';}
    const ready=typingDone;
    app.innerHTML=`${qHead}
      <div id="timerHolder">${buzzed?buzzTimerHTML(r):timerHTML(r)}</div>
      <div class="status">${
        buzzed
          ? (mine?'✅ Locked in: '+esc(my?my.choice:'')  : '🔒 '+esc(bName)+' buzzed first')
          : (ready?'Hit the buzzer to answer!':'Reading the question…')}</div>
      <div class="buzzer"><button class="${cls}" id="bz" ${(buzzed||!ready)?'disabled':''}>${ready||buzzed?lab:'…'}</button></div>
      <div class="center"><button class="backlink" id="leave">Leave</button></div>`;
    const el1=document.getElementById('qtext');
    if(needType){typedSig=sig;typeText(el1,q.q,()=>renderOnline(lastRoom));}else{el1.textContent=q.q;}
    const bzEl=document.getElementById('bz');
    if(bzEl&&!buzzed&&ready) bindTap(bzEl,onlineBuzz);
    document.getElementById('leave').onclick=goHome;
    return;
  }

  app.innerHTML=`${qHead}
    <div id="timerHolder">${timerHTML(r)}</div>
    ${my?`<div class="answered">✅ Locked in: <b>${esc(my.choice)}</b><div class="mini" style="margin-top:4px">Waiting for the others…</div></div>`:''}
    <div class="opts">

        <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>

  if(!my) document.querySelectorAll('.optbtn').forEach(b=>bindTap(b,()=>pickAnswer(b.dataset.o)));
  document.getElementById('leave').onclick=goHome;
}

function buzzTimerHTML(r){
  if(!r.buzzedAt) return '';
  const rem=Math.max(0,BUZZ_ANSWER_S-((serverNow()-r.buzzedAt)/1000));
  const pct=Math.max(0,Math.min(100,(rem/BUZZ_ANSWER_S)*100));
  const warn=rem<=3;
  if(rem<=0) return `<div class="timer"><div class="timeup">⏰ Time's up!</div></div>`;
  return `<div class="timer">
    <div class="timer-label">Answer now</div>
    <div class="timer-num ${warn?'warn':''}">${Math.ceil(rem)}s</div>
    <div class="timer-bar"><div class="timer-fill ${warn?'warn':''}" style="width:${pct}%"></div></div>
  </div>`;
}

async function onlineBuzz(){
  unlockAudio();
  if (!ME.code || !ME.id || !lastRoom) return;
  try{
    const res=await db.ref('rooms/'+ME.code+'/buzzedBy').transaction(cur=>{
      if(cur===null||cur===undefined) return ME.id;
      return;
    });
    if(res && res.committed && res.snapshot.val()===ME.id){
      sBuzz();
      if(navigator.vibrate) navigator.vibrate(60);
      await db.ref('rooms/'+ME.code+'/buzzedAt').set(firebase.database.ServerValue.TIMESTAMP);
    }else{
      const buzzedPid = res && res.snapshot ? res.snapshot.val() : null;
      const nm=buzzedPid ? (playersObj(lastRoom)[buzzedPid] || 'Someone') : 'Someone';
      toast('Too late — '+nm+' buzzed first');
    }
  }catch(e){ toast('Connection hiccup, try again'); }
}

async function pickAnswer(val){
  unlockAudio();
  if(!ME.code || !ME.id || !lastRoom) return;
  const q = currentQ(lastRoom);
  const mySig = 'A' + lastRoom.qIndex + '_' + val;
  if (myLockedSig === mySig) return;
  myLockedSig = mySig;
  
  try {
    await db.ref('rooms/' + ME.code + '/answers/' + ME.id).set({
      choice: val,
      at: serverNow()
    });
    sTick();
    if (navigator.vibrate) navigator.vibrate(40);
  } catch(e) {
    myLockedSig = null;
    toast('Failed to lock in answer. Retrying...');
  }
}

  return `<div class="scores">
    <div class="ans-label" style="margin-bottom:8px">Players (${players.length}) &amp; Scores</div>

async function modJudge(correct){
  const r=lastRoom,bid=r.buzzedBy;
  const nm=bid?playersObj(r)[bid]:'';
  const up={};
  const gain=r.dbl?20:10;
  const penalty=(r.neg||0)*(r.dbl?2:1);
  let delta=0;
  if(bid){
    delta = correct ? gain : -penalty;
    if(delta!==0) up['rooms/'+ME.code+'/scores/'+bid]=(scoresObj(r)[bid]||0)+delta;
  }
  up['rooms/'+ME.code+'/result']={name:nm,correct,pts:delta};
  up['rooms/'+ME.code+'/buzzedBy']=null;
  up['rooms/'+ME.code+'/buzzedAt']=null;
  await db.ref().update(up);
}

async function modNav(d){
  const r=lastRoom;
  if(d>0 && r.qIndex+1>=deckLen(r) && !r.openEnded){
    await db.ref('rooms/'+ME.code).update({finished:true,buzzedBy:null,buzzedAt:null});
    return;
  }
  const i=Math.max(0,Math.min(deckLen(r)-1,r.qIndex+d));
  await db.ref('rooms/'+ME.code).update({
    qIndex:i,revealed:false,revealedAt:null,buzzedBy:null,buzzedAt:null,
    result:null,answers:null,showAnswer:false,dbl:false,options:null
  });
}

async function endGame(){
  if(confirm('End the game and show everyone the final rankings?'))
    await db.ref('rooms/'+ME.code).update({finished:true,buzzedBy:null,buzzedAt:null});
}

function fffPointsFor(rank){return rank<FFF_POINTS.length?FFF_POINTS[rank]:3;}

    ${r.revealed&&r.dbl?`<div class="answered" style="background:var(--gold);border-style:solid;color:#07090e">✖️2 Double points this round</div>`:''}
    ${r.revealed&&!r.showAnswer?`
      <div class="buzzed">
        <div class="ans-label">Answers received</div>

        <div id="timerHolder">${timerHTML(r)}</div>

  if(g('reveal'))g('reveal').onclick=fffReveal;

function fffResultRows(r){
  const q=currentQ(r),ans=answersObj(r),pl=playersObj(r);
  const rows=Object.entries(ans).map(([id,a])=>({id,nm:pl[id]||'?',choice:a.choice,at:a.at,ok:a.choice===q.a}));
  const correct=rows.filter(x=>x.ok).sort((a,b)=>a.at-b.at);
  correct.forEach((x,i)=>{x.rank=i;x.pts=fffPointsFor(i);});
  const wrong=rows.filter(x=>!x.ok);
  const noAns=Object.entries(pl).filter(([id])=>!ans[id]);
  const line=(x,extra)=>`<div class="srow" style="margin-bottom:6px"><span>${esc(x.nm)}${extra||''}</span><span class="pts">${x.pts!=null?'+'+x.pts:'0'}</span></div>`;
  return `${correct.map((x,i)=>line(x,` <span class="speed-tag">${i===0?'⚡ fastest':'#'+(i+1)}</span>`)).join('')}
    ${wrong.map(x=>line({nm:x.nm,pts:0},' ❌')).join('')}
    ${noAns.map(([id,nm])=>line({nm,pts:0},' — no answer')).join('')}`;
}

async function fffReveal(){
  const r=lastRoom;
  const opts=optionsForRoom(r);
  await db.ref('rooms/'+ME.code).update({
    revealed:true,revealedAt:firebase.database.ServerValue.TIMESTAMP,
    options:opts,answers:null,showAnswer:false
  });
}

async function fffLock(){
  const r=lastRoom,q=currentQ(r),ans=answersObj(r);
  const correct=Object.entries(ans).filter(([id,a])=>a.choice===q.a).sort((a,b)=>a[1].at-b[1].at);
  const up={};
  correct.forEach(([id],i)=>{
    const pts=fffPointsFor(i)*(r.dbl?2:1);
    up['rooms/'+ME.code+'/scores/'+id]=(scoresObj(r)[id]||0)+pts;
  });
  up['rooms/'+ME.code+'/showAnswer']=true;
  await db.ref().update(up);
}

/* ---------- PLAYER ---------- */
let typedSig=null,typeTimer=null;
let typingDone=true;
function typeText(el,text,onDone){
  if(!el)return;
  if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
  typingDone=false;
  el.textContent='';
  const cur=document.createElement('span');cur.className='typecursor';el.appendChild(cur);
  let i=0;
  typeTimer=setInterval(()=>{
    if(i>=text.length){
      clearInterval(typeTimer);typeTimer=null;
      if(cur.parentNode)cur.remove();
      typingDone=true;
      if(typeof onDone==='function') onDone();
      return;
    }
    cur.insertAdjacentText('beforebegin',text[i]);i++;
  },16);
}

function playerHeader(r,myScore){
  const shown=r.suspense?'🙈':myScore;
  return `<div class="modbar">
    <div><div class="sub" style="margin:0">${esc(ME.name)}</div><div style="font-weight:900;font-size:15px">Room #${r.code}</div></div>
    <div class="center"><div class="ans-label">${r.suspense?'Hidden':'Score'}</div><div style="font-size:25px;font-weight:900;color:var(--gold)">${shown}</div></div>
  </div>`;
}

function renderPlayer(r){
  if(r.finished){renderResults(r);return;}
  const myScore=scoresObj(r)[ME.id]||0;
  if(!r.started){
    const n=Object.keys(playersObj(r)).length;
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="qbox center" style="margin-top:auto;margin-bottom:auto">
        <div style="font-size:38px">⏳</div>
        <div class="qtext" style="margin-top:10px">You're in!</div>
        <div class="mini" style="margin-top:8px">Waiting for <b>${esc(r.hostName||'the host')}</b> to start…</div>
        <div class="mini" style="margin-top:4px">${n} player${n===1?'':'s'} · ${r.mode==='fff'?'⚡ Fastest Fingering First':'🔔 Buzzer'} mode</div>
      </div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;
    typedSig=null;typingDone=false;return;
  }
  if(r.mode==='fff') return renderPlayerFFF(r,myScore);
  return renderPlayerBuzzer(r,myScore);
}

function renderPlayerBuzzer(r,myScore){
  const q=currentQ(r);
  if(r.result){
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="result-banner ${r.result.correct?'result-correct':'result-wrong'}" style="margin-top:auto">
        <div class="result-emoji">${r.result.correct?'✅':'❌'}</div>
        <div class="result-text">${r.result.correct?'Correct!':'Wrong'}</div>
        <div class="result-sub">${esc(r.result.name)}${r.result.correct?(r.suspense?' got it right':' scored +'+(r.result.pts||10)):(r.suspense?' got it wrong':(r.result.pts<0?' '+r.result.pts+' points':' — no points'))}</div>
      </div>
      <div class="mini" style="margin-top:16px;margin-bottom:auto">Waiting for the next question…</div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;return;
  }
  if(!r.revealed){
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="getready" style="margin-top:auto;margin-bottom:auto">
        <div class="big">👂</div>
        <div class="qtext" style="margin-top:10px">Get ready…</div>
        <div class="mini" style="margin-top:8px">Question ${r.qIndex+1} of ${deckLen(r)}</div>
        <div class="mini" style="margin-top:4px">${esc(r.hostName||'The host')} is reading the question.</div>
      </div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;typedSig=null;return;
  }
  const buzzed=!!r.buzzedBy,mine=r.buzzedBy===ME.id;
  const bName=buzzed?playersObj(r)[r.buzzedBy]:'';
  let cls='bz',lab='BUZZ';
  if(buzzed&&mine){cls='bz mine';lab='YOU!';}
  else if(buzzed){cls='bz locked';lab='🔒';}
  const sig='B'+r.qIndex+r.code;
  const needType=typedSig!==sig;
  app.innerHTML=`${playerHeader(r,myScore)}
    <div class="qbox">
      <span class="cat-chip" style="background:${catColor(q.c)}">${esc(q.c)}</span>
      <div class="qnum" style="margin-top:12px">Q ${r.qIndex+1} of ${deckLen(r)} · Host: ${esc(r.hostName||'Moderator')}</div>
      <div class="qtext" id="qtext"></div>
    </div>
    <div id="timerHolder">${buzzed?timerHTML(r):''}</div>
    <div class="status">${mine?'🎉 You buzzed first! Answer now.':buzzed?'🔒 '+esc(bName)+' buzzed first':'Hit the buzzer!'}</div>
    <div class="buzzer"><button class="${cls}" id="bz" ${buzzed?'disabled':''}>${lab}</button></div>
    <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
  const el=document.getElementById('qtext');
  if(needType){typedSig=sig;typeText(el,q.q);}else{el.textContent=q.q;}
  const b=document.getElementById('bz');
  if(b&&!buzzed)b.onclick=playerBuzz;
  document.getElementById('leave').onclick=goHome;
}

async function playerBuzz(){
  unlockAudio();sBuzz();
  if(navigator.vibrate)navigator.vibrate(60);
  const ref=db.ref('rooms/'+ME.code);
  try{
    const res=await ref.child('buzzedBy').transaction(cur=>{
      if(cur===null||cur===undefined) return ME.id;
      return;
    });
    if(res.committed&&res.snapshot.val()===ME.id){
      await ref.child('buzzedAt').set(firebase.database.ServerValue.TIMESTAMP);
    }else{
      const nm=playersObj(lastRoom)[res.snapshot.val()]||'Someone';
      toast('Too late — '+nm+' got it');
    }
  }catch(e){toast('Connection hiccup, try again');}
}

function renderPlayerFFF(r,myScore){
  const q=currentQ(r);
  const opts=r.options||[];
  const ans=answersObj(r);
  const my=ans[ME.id];
  if(r.showAnswer){
    const ok=my&&my.choice===q.a;
    const correctSorted=Object.entries(ans).filter(([id,a])=>a.choice===q.a).sort((a,b)=>a[1].at-b[1].at);
    const myRank=correctSorted.findIndex(([id])=>id===ME.id);
    const pts=ok?fffPointsFor(myRank)*(r.dbl?2:1):0;
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="result-banner ${ok?'result-correct':'result-wrong'}" style="margin-top:14px">
        <div class="result-emoji">${ok?'✅':'❌'}</div>
        <div class="result-text">${ok?'Correct!':(my?'Wrong':'No answer')}</div>
        <div class="result-sub">${ok?(myRank===0?'⚡ Fastest! ':'#'+(myRank+1)+' fastest ')+(r.suspense?'':'+'+pts+' points'):'The answer was: '+esc(q.a)}</div>
      </div>
      <div class="opts">
        ${opts.map((o,i)=>{
          const isC=o===q.a, mineWrong=my&&my.choice===o&&!isC;
          return `<button class="optbtn ${isC?'correct':''} ${mineWrong?'wrongpick':''}" disabled>
            <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
        }).join('')}
      </div>
      <div class="mini" style="margin-top:14px">Waiting for the next question…</div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;return;
  }
  if(!r.revealed){
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="getready" style="margin-top:auto;margin-bottom:auto">
        <div class="big">👂</div>
        <div class="qtext" style="margin-top:10px">Get ready…</div>
        <div class="mini" style="margin-top:8px">Question ${r.qIndex+1} of ${deckLen(r)}</div>
        <div class="mini" style="margin-top:4px">${esc(r.hostName||'The host')} is reading the question.</div>
      </div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;typedSig=null;return;
  }
  const sig='F'+r.qIndex+r.code;
  const needType=typedSig!==sig;
  app.innerHTML=`${playerHeader(r,myScore)}
    <div class="qbox">
      <span class="cat-chip" style="background:${catColor(q.c)}">${esc(q.c)}</span>
      <div class="qnum" style="margin-top:12px">Q ${r.qIndex+1} of ${deckLen(r)} · Host: ${esc(r.hostName||'Moderator')}</div>
      <div class="qtext" id="qtext"></div>
    </div>
    <div id="timerHolder">${timerHTML(r)}</div>
    ${my?`<div class="answered">✅ Locked in: <b>${esc(my.choice)}</b><div class="mini" style="margin-top:4px">Waiting for others…</div></div>`:''}
    <div class="opts">
      ${opts.map((o,i)=>`<button class="optbtn ${my&&my.choice===o?'picked':''}" data-o="${esc(o)}" ${my?'disabled':''}>
        <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
  const el=document.getElementById('qtext');
  if(needType){typedSig=sig;typeText(el,q.q);}else{el.textContent=q.q;}
  if(!my){
    document.querySelectorAll('.optbtn').forEach(b=>bindTap(b,()=>pickAnswer(b.dataset.o)));
  }
  document.getElementById('leave').onclick=goHome;
}

// SOFT-KEYBOARD VIEWPORT ADAPTER
(function() {
  function handleFocusScroll(e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
      setTimeout(() => {
        e.target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
      }, 300);
    }
  }

  document.addEventListener('focusin', handleFocusScroll);

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  }
})();

async function joinFromLauncher(roomCode, pName, pId, isHostFlag) {
  const actualPid = pId || uid();
  ME = {
    role: isHostFlag ? 'mod' : 'player',
    name: pName,
    code: roomCode,
    id: isHostFlag ? 'mod' : actualPid
  };

  setupSel.name = pName;

  // Listen to master_rooms status for auto-return when Host disbands or leaves
  if (typeof db !== 'undefined' && roomCode) {
    db.ref(`master_rooms/${roomCode}/status`).on('value', snap => {
      const status = snap.val();
      if (status === 'LOBBY' || status === 'DISBANDED' || !status) {
        if (ME.role !== 'mod') {
          returnToLauncher();
        }
      }
    });

    // Real-time Player Roster Sync from master_rooms to local rooms
    masterPlayersRef = db.ref(`master_rooms/${roomCode}/players`);
    masterPlayersRef.on('value', snap => {
      const masterPlayers = snap.val() || {};
      const updates = {};
      Object.entries(masterPlayers).forEach(([pid, playerData]) => {
        if (playerData && playerData.name) {
          updates[`rooms/${roomCode}/players/${pid}`] = playerData.name;
          if (scoresObj(lastRoom||{})[pid] === undefined) {
            updates[`rooms/${roomCode}/scores/${pid}`] = 0;
          }
        }
      });
      if (Object.keys(updates).length > 0) {
        db.ref().update(updates);
      }
    });
  }

  const snap = await db.ref('rooms/' + roomCode).get();

  if (isHostFlag) {
    screenHostSetup();
    return;
  }

  // Non-Host Live Config & Meta Sync
  roomConfigRef = db.ref('rooms/' + roomCode);
  roomConfigRef.on('value', roomSnap => {
    if (roomSnap.exists()) {
      const data = roomSnap.val();
      if (data.mode) setupSel.mode = data.mode;
      if (data.timeLimit !== undefined) setupSel.time = data.timeLimit;
      if (data.cats) setupSel.cats = data.cats;
      if (data.topic) setupSel.topic = data.topic;
    }
  });

  if (!snap.exists()) {
    const deck = buildDeck(CATEGORIES, 20);
    const room = {
      code: roomCode,
      created: firebase.database.ServerValue.TIMESTAMP,
      hostName: pName,
      mode: 'fff',
      online: true,
      suspense: false,
      dblEnabled: true,
      dblSet: {},
      dbl: false,
      neg: 0,
      engineId: 'mod',
      phase: 'countdown',
      phaseAt: null,
      seq: 0,
      cats: CATEGORIES,
      timeLimit: 15,
      src: 'bank',
      topic: null,
      aiQ: null,
      openEnded: false,
      started: false,
      finished: false,
      qIndex: 0,
      revealed: false,
      revealedAt: null,
      buzzedBy: null,
      buzzedAt: null,
      result: null,
      answers: null,
      showAnswer: false,
      options: null,
      players: { [ME.id]: pName },
      scores: { [ME.id]: 0 },
      deck: deck
    };
    await db.ref('rooms/' + roomCode).set(room);
  } else {
    const up = {};
    up['rooms/' + roomCode + '/players/' + ME.id] = pName;
    up['rooms/' + roomCode + '/scores/' + ME.id] = 0;
    await db.ref().update(up);
  }

  subscribeRoom(roomCode);
}

function screenHome() {
  const urlParams = new URLSearchParams(window.location.search);
  const autoRoom = urlParams.get('room');
  const autoName = urlParams.get('name');
  const autoPid  = urlParams.get('pid');
  const autoHost = urlParams.get('isHost') === 'true';

  if (autoRoom && autoName) {
    joinFromLauncher(autoRoom, autoName, autoPid, autoHost);
    return; 
  }

  stopTicking();
  app.innerHTML = `
    <div class="home-hero">
      <span class="tag">Online & Local</span>
      <h1>Quiz Night</h1>
      <div class="sub">Party Quiz & Buzzer</div>
    </div>
    <div class="card">
      <label>Your Name</label>
      <input type="text" id="pname" placeholder="Enter name..." maxlength="18" value="${esc(ME.name || '')}">
      <button class="btn btn-gold" id="btn-host">👑 Host a Game</button>
      <button class="btn btn-teal" id="btn-join">👥 Join a Room</button>
    </div>
  `;
}

/* Boot */
document.addEventListener('DOMContentLoaded', () => {
  screenHome();
