<script>
const FIREBASE_CONFIG = {

const PRESET_CATEGORIES = [

function catColor(c) { return '#111111'; }
function shuffle(arr) { const a = arr.slice(); for(let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* Wake Lock System */
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.log('Wake Lock Error:', err);
  }
}
document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    await requestWakeLock();
  }
});

/* Firebase Init */
let db = null, serverOffset = 0;
function configured() { return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL; }
try {
  if (configured()) {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    db.ref('.info/serverTimeOffset').on('value', s => { serverOffset = s.val() || 0; });
    db.ref('.info/connected').on('value', s => {
      const el = document.getElementById('conn');
      if (s.val()) { el.textContent = '● online'; el.classList.add('ok'); }
      else { el.textContent = 'connecting…'; el.classList.remove('ok'); }
    });
  }
} catch(e) { console.error('Firebase init failed', e); }

/* Helpers */
const app = document.getElementById('app');
let ME = { role: null, name: null, code: null, id: null };
let roomRef = null, roomListener = null, lastRoom = null;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000); }
function uid() { return Math.random().toString(36).slice(2, 9); }
function newCode() { return Math.floor(1000 + Math.random() * 9000).toString(); }
let myLockedSig = null;
function serverNow() { return Date.now() + serverOffset; }

function bindTap(el, fn) {
  if (!el) return;
  let done = false;
  const fire = (ev) => { if (done) return; done = true; ev.preventDefault(); fn(ev); };
  el.addEventListener('pointerdown', fire, { passive: false });
  el.addEventListener('click', fire);
}

function playersObj(r) { return (r && r.players) || {}; }

/* Real Players Filter: Dedicated 'mod' and non-playing host in Hosted mode are excluded */
function realPlayersObj(r) {
  const pMap = playersObj(r);
  const out = {};
  const isOnline = !!(r && r.online || (r && r.settings && r.settings.online));
  Object.entries(pMap).forEach(([id, p]) => {
    if (!p) return;
    const isDedicatedMod = id === 'mod' && !isOnline;
    const isHostInHostedMode = (typeof p === 'object' && p.isHost) && !isOnline;
    if (!isDedicatedMod && !isHostInHostedMode) {
      out[id] = p;
    }
  });
  return out;
}

function scoresObj(r) { return (r && r.scores) || {}; }
function answersObj(r) { return (r && r.answers) || {}; }
function deckLen(r) { return r && r.targetCount ? r.targetCount : (r && r.aiQ ? r.aiQ.length : 20); }

function currentQ(r) {
  if (r && r.aiQ && Array.isArray(r.aiQ) && r.aiQ.length > 0 && r.aiQ[r.qIndex]) {
    const q = r.aiQ[Math.min(r.qIndex, r.aiQ.length - 1)];
    return { c: q.cat || 'AI', q: q.q, a: q.a, opts: q.opts, valid: true };
  }
  return { c: 'AI', q: 'Loading question...', a: '', opts: [], valid: false };
}

function optionsForRoom(r) {
  const q = currentQ(r);
  return q.valid && q.opts && q.opts.length >= 4 ? shuffle(q.opts.slice(0, 4)) : [];
}
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* Sound System */
let AC = null, soundReady = false;
function ensureAC() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } } return AC; }
function unlockAudio() {
  requestWakeLock();
  const ac = ensureAC(); if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  if (!soundReady) {
    try { const b = ac.createBuffer(1, 1, 22050); const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); soundReady = true; } catch(e) {}
  }
}
['pointerdown', 'touchstart', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));

function tone(freq, start, dur, vol, type) {
  const ac = ensureAC(); if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, ac.currentTime + start);
  const t = ac.currentTime + start;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.03);
}
function sBuzz() { tone(440, 0, 0.28, 0.3, 'square'); tone(660, 0.10, 0.28, 0.3, 'square'); }
function sBeep() { tone(880, 0, 0.13, 0.32, 'sine'); }
function sTimeUp() { tone(300, 0, 0.18, 0.32, 'sawtooth'); tone(300, 0.22, 0.30, 0.32, 'sawtooth'); }
function sCorrect() { tone(523, 0, 0.14, 0.3, 'sine'); tone(659, 0.12, 0.14, 0.3, 'sine'); tone(784, 0.24, 0.30, 0.32, 'sine'); }
function sWrong() { tone(200, 0, 0.26, 0.32, 'sawtooth'); tone(150, 0.20, 0.38, 0.32, 'sawtooth'); }
function sTick() { tone(1200, 0, 0.05, 0.18, 'sine'); }
function sDouble() { tone(523, 0, 0.12, 0.3, 'square'); tone(659, 0.12, 0.12, 0.3, 'square'); tone(784, 0.24, 0.12, 0.3, 'square'); tone(1047, 0.36, 0.34, 0.34, 'square'); }
function sGo() { tone(660, 0, 0.10, 0.3, 'sine'); tone(990, 0.12, 0.22, 0.32, 'sine'); }

/* Timer */
let tickInterval = null, lastBeepSecond = null, playedTimeUp = false;
function timerStart(r) {
  if (!r || !r.timeLimit) return null;
  if (r.online) {
    if (r.phase !== 'question') return null;
    if (r.mode === 'buzzer') return r.buzzedBy ? (r.buzzedAt || r.phaseAt) : null;
    return r.phaseAt;
  }
  if (r.mode === 'fff') return r.revealed ? r.revealedAt : null;
  return r.buzzedAt || null;
}

function remainingSecs(r) {
  const st = timerStart(r);
  if (!r || !r.started || !r.timeLimit || !st) return null;
  if (r.online) {
    if (r.phase !== 'question') return null;
    const limit = (r.mode === 'buzzer' && r.buzzedBy) ? BUZZ_ANSWER_S : r.timeLimit;
    return Math.max(0, limit - ((serverNow() - st) / 1000));
  }
  if (r.mode === 'fff' && r.showAnswer) return null;
  if (r.mode !== 'fff' && r.result) return null;
  return Math.max(0, r.timeLimit - ((serverNow() - st) / 1000));
}

function startTicking() {
  if (tickInterval) return;
  tickInterval = setInterval(() => {
    const r = lastRoom; const rem = remainingSecs(r);
    if (rem === null) { lastBeepSecond = null; playedTimeUp = false; return; }
    const whole = Math.ceil(rem); const win = (r.timeLimit <= 5) ? 2 : 5;
    if (ME.role === 'player') {
      const answered = r.mode === 'fff' && answersObj(r)[ME.id];
      if (!answered) {
        if (rem > 0 && whole <= win && whole !== lastBeepSecond) { lastBeepSecond = whole; sBeep(); }
        if (rem <= 0 && !playedTimeUp) { playedTimeUp = true; sTimeUp(); }
      }
    }
    const h = document.getElementById('timerHolder');
    if (h) h.innerHTML = timerHTML(r);
  }, 250);
}
let uiTimer = null;
function startUITick() {
  if (uiTimer) return;
  uiTimer = setInterval(() => {
    const r = lastRoom;
    if (!r || !r.online || r.finished) return;
    if (r.phase === 'countdown' || r.phase === 'reveal') renderOnline(r);
  }, 500);
}
function stopUITick() { if (uiTimer) { clearInterval(uiTimer); uiTimer = null; } }
function stopTicking() { if (tickInterval) { clearInterval(tickInterval); tickInterval = null; } lastBeepSecond = null; playedTimeUp = false; }

function timerHTML(r) {
  const rem = remainingSecs(r);
  if (rem === null) return '';
  const warn = rem <= ((r.timeLimit <= 5) ? 2 : 5);
  const limit = (r.online && r.mode === 'buzzer' && r.buzzedBy) ? BUZZ_ANSWER_S : r.timeLimit;
  const pct = Math.max(0, Math.min(100, (rem / limit) * 100));
  if (rem <= 0) return `<div class="timer"><div class="timeup">⏰ Time's up!</div></div>`;
  return `<div class="timer">
    <div class="timer-label">Time to answer</div>
    <div class="timer-num ${warn ? 'warn' : ''}">${Math.ceil(rem)}s</div>
    <div class="timer-bar"><div class="timer-fill ${warn ? 'warn' : ''}" style="width:${pct}%"></div></div>
  </div>`;
}

/* Online Engine */
const COUNTDOWN_S = 3, REVEAL_S = 5, BUZZ_ANSWER_S = 10;
let engineTimer = null;
const FFF_POINTS = [10, 8, 6, 5, 4];
function fffPointsFor(rank) { return rank < FFF_POINTS.length ? FFF_POINTS[rank] : 3; }
function pointsFor(r, rank) {
  const base = r.mode === 'buzzer' ? (rank === 0 ? 10 : 0) : fffPointsFor(rank);
  return r.dbl ? base * 2 : base;
}
function startEngine() { if (!engineTimer) engineTimer = setInterval(engineTick, 350); }
function stopEngine() { if (engineTimer) { clearInterval(engineTimer); engineTimer = null; } }

async function claim(r) {
  try {
    const res = await db.ref('rooms/' + ME.code + '/seq').transaction(cur => {
      const now = (cur == null) ? 0 : cur;
      if (now !== (r.seq || 0)) return;
      return now + 1;
    });
    return !!res.committed;
  } catch(e) { return false; }
}

async function engineTick() {
  const r = lastRoom;
  if (!r || !r.online || !r.started || r.finished || !r.phaseAt) return;
  const el = (serverNow() - r.phaseAt) / 1000;
  const activeHumanPlayers = Object.keys(realPlayersObj(r)).length;

  if (r.phase === 'countdown') {
    if (el >= COUNTDOWN_S && await claim(r)) await onlineStartQuestion(r);
    return;
  }
  if (r.phase === 'question') {
    if (r.mode === 'buzzer') {
      if (r.buzzedBy) {
        const since = (serverNow() - (r.buzzedAt || serverNow())) / 1000;
        const answered = answersObj(r)[r.buzzedBy];
        if ((answered || since >= BUZZ_ANSWER_S) && await claim(r)) await onlineEndQuestion(r);
      } else if (el >= r.timeLimit && await claim(r)) {
        await onlineEndQuestion(r);
      }
    } else {
      const got = Object.keys(answersObj(r)).length;
      if ((el >= r.timeLimit || (activeHumanPlayers > 0 && got >= activeHumanPlayers)) && await claim(r)) await onlineEndQuestion(r);
    }
    return;
  }
  if (r.phase === 'reveal') {
    if (el >= REVEAL_S && await claim(r)) await onlineNext(r);
  }
}

async function onlineStartQuestion(r) {
  await db.ref('rooms/' + ME.code).update({
    phase: 'question', phaseAt: firebase.database.ServerValue.TIMESTAMP,
    options: optionsForRoom(r), answers: null, showAnswer: false, revealed: true,
    buzzedBy: null, buzzedAt: null
  });
}

async function onlineEndQuestion(r) {
  const q = currentQ(r), ans = answersObj(r);
  const up = {};
  if (r.mode === 'buzzer') {
    const bid = r.buzzedBy; const a = bid ? ans[bid] : null;
    const gain = r.dbl ? 20 : 10;
    const penalty = (r.neg || 0) * (r.dbl ? 2 : 1);

    if (bid) {
      if (a && a.choice === q.a) {
        up['rooms/' + ME.code + '/scores/' + bid] = (scoresObj(r)[bid] || 0) + gain;
      } else if (penalty > 0) {
        up['rooms/' + ME.code + '/scores/' + bid] = (scoresObj(r)[bid] || 0) - penalty;
      }
    }
  } else {
    const correct = Object.entries(ans).filter(([id, a]) => a.choice === q.a).sort((a, b) => a[1].at - b[1].at);
    correct.forEach(([id], i) => {
      const pts = pointsFor(r, i);
      if (pts > 0) up['rooms/' + ME.code + '/scores/' + id] = (scoresObj(r)[id] || 0) + pts;
    });
  }
  up['rooms/' + ME.code + '/showAnswer'] = true;
  up['rooms/' + ME.code + '/phase'] = 'reveal';
  up['rooms/' + ME.code + '/phaseAt'] = firebase.database.ServerValue.TIMESTAMP;
  await db.ref().update(up);
}

async function onlineNext(r) {
  const nextI = r.qIndex + 1;
  if (nextI >= deckLen(r)) {
    await db.ref('rooms/' + ME.code).update({ finished: true });
    return;
  }
  await db.ref('rooms/' + ME.code).update({
    qIndex: nextI, phase: 'countdown', phaseAt: firebase.database.ServerValue.TIMESTAMP,
    options: null, answers: null, showAnswer: false, revealed: false,
    dbl: !!(r.dblSet && r.dblSet[nextI])
  });
}

/* Subscribe & Audio Diff Sync */
function subscribeRoom(code) {
  unsubscribeRoom();
  roomRef = db.ref('rooms/' + code);
  roomListener = roomRef.on('value', snap => {
    const r = snap.val();
    if (!r) { 
      if (ME.role === 'player') renderWaitingForHostSetup();
      return; 
    }

    const prev = lastRoom;
    if (prev && (prev.qIndex !== r.qIndex || (prev.phase === 'question' && r.phase !== 'question'))) {
      myLockedSig = null;
    }

    handleRoomAudioDiff(prev, r);
    lastRoom = r;

    if (r.phase === 'generating') {
      screenGenerating(`Building Trivia Questions...`);
      return;
    }

    if (r.phase === 'setup') {
      const isHostUser = ME.role === 'mod' || 
                         (r.players && r.players[ME.id] && r.players[ME.id].isHost) || 
                         (r.hostName && ME.name && r.hostName.toLowerCase() === ME.name.toLowerCase());
      if (isHostUser) {
        ME.role = 'mod';
        renderHostSetupUI(r);
      } else {
        renderPlayerSetupUI(r);
      }
      return;
    }

    if (r.online && r.started && !r.finished) { startEngine(); startUITick(); } else if (!r.online) { stopEngine(); stopUITick(); }
    const st = timerStart(r);
    if (r.started && r.timeLimit && st) {
      if (!prev || timerStart(prev) !== st) { lastBeepSecond = null; playedTimeUp = false; }
      startTicking();
    } else stopTicking();

    if (r.online) renderOnline(r);
    else if (ME.role === 'mod') renderMod(r);
    else renderPlayer(r);
  });
}

function unsubscribeRoom() { if (roomRef && roomListener) roomRef.off('value', roomListener); roomRef = null; roomListener = null; }

function handleRoomAudioDiff(prev, r) {
  if (!prev) return;
  if (!prev.dbl && r.dbl) sDouble();
  if (!prev.buzzedBy && r.buzzedBy) sBuzz();

  if (!prev.result && r.result) {
    if (r.result.correct) sCorrect(); else sWrong();
  }

  if (r.online) {
    if (prev.phase !== 'question' && r.phase === 'question') sGo();
    if (prev.phase !== 'reveal' && r.phase === 'reveal') {
      if (r.mode === 'buzzer') {
        const bid = r.buzzedBy;
        const myAns = answersObj(r)[bid];
        const q = currentQ(r);
        if (myAns && myAns.choice === q.a) sCorrect(); else sWrong();
      } else {
        const my = answersObj(r)[ME.id], q = currentQ(r);
        if (my && my.choice === q.a) sCorrect(); else sWrong();
      }
    }
  } else if (r.mode === 'fff') {
    if (!prev.showAnswer && r.showAnswer) {
      const my = answersObj(r)[ME.id], q = currentQ(r);
      if (my && my.choice === q.a) sCorrect(); else sWrong();
    }
  } else {
    if (!prev.revealed && r.revealed) sGo();
  }
}

let defaultSetupSettings = { cats: [], count: 20, time: 15, mode: 'buzzer', online: false, suspense: false, dbl: true, neg: 0, topic: '' };

async function initHostRoomInFirebase() {
  const code = ME.code || newCode();

  const initialPlayers = {};
  if (db && code) {
    try {
      const masterSnap = await db.ref(`master_rooms/${code}/players`).get();
      if (masterSnap.exists()) {
        const mPlayers = masterSnap.val() || {};
        Object.entries(mPlayers).forEach(([pid, pData]) => {
          if (pData && pData.name) {
            initialPlayers[pid] = { name: pData.name, ready: pData.isHost ? true : false, isHost: !!pData.isHost };
          }
        });
      }
    } catch(e){}
  }

  const room = {
    code,
    phase: 'setup',
    hostName: ME.name || 'Host',
    settings: defaultSetupSettings,
    players: initialPlayers,
    scores: {}
  };

  await db.ref('rooms/' + code).set(room);
  subscribeRoom(code);
}

async function fetchFullQuizSingleCall(topic, cats, totalCount) {
  try {
    const res = await fetch('/api/questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: topic || '', categories: cats || [], count: totalCount, avoid: [] })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      const msg = data.error || `HTTP ${res.status} Error`;
      toast(`AI Error: ${msg}`);
      return [];
    }

    return Array.isArray(data.questions) ? data.questions : [];
  } catch (e) {
    toast(`Network error: ${e.message}`);
    return [];
  }
}

async function startQuestionGeneration(r) {
  unlockAudio();
  const settings = r.settings || defaultSetupSettings;
  const total = settings.count || 20;
  const topicLabel = settings.topic || (settings.cats ? settings.cats.join(', ') : 'General Knowledge');

  await db.ref(`rooms/${r.code}`).update({
    phase: 'generating',
    topicLabel: topicLabel
  });

  let questions = await fetchFullQuizSingleCall(settings.topic, settings.cats, total);

  if (questions.length === 0) {
    toast('Failed to generate questions. Returning to setup.');
    await db.ref(`rooms/${r.code}/phase`).set('setup');
    return;
  }

  let tl = Math.min(30, Math.max(5, settings.time));
  const dblSet = {};
  if (settings.dbl) {
    for (let i = 0; i < questions.length; i++) { if (Math.random() < 0.25) dblSet[i] = true; }
  }

  const myId = settings.online ? uid() : 'mod';
  const players = r.players || {};
  const scores = {};
  Object.keys(players).forEach(pid => { scores[pid] = 0; });

  if (settings.online && !players[myId]) {
    players[myId] = { name: r.hostName || 'Host', ready: true, isHost: true };
    scores[myId] = 0;
  }

  const activePhase = settings.online ? 'countdown' : 'question';

  await db.ref('rooms/' + r.code).update({
    hostName: r.hostName || 'Host',
    mode: settings.mode,
    online: !!settings.online,
    suspense: !!settings.suspense,
    dblEnabled: !!settings.dbl,
    dblSet, dbl: false,
    neg: settings.neg || 0,
    engineId: settings.online ? myId : null,
    phase: activePhase,
    phaseAt: firebase.database.ServerValue.TIMESTAMP,
    seq: 0,
    timeLimit: tl,
    targetCount: questions.length,
    src: 'ai',
    aiQ: questions,
    started: true,
    finished: false,
    qIndex: 0,
    revealed: false,
    revealedAt: null,
    buzzedBy: null,
    buzzedAt: null,
    result: null,
    answers: null,
    showAnswer: false,
    options: null,
    players,
    scores
  });

  ME = settings.online
    ? { role: 'player', name: r.hostName || 'Host', code: r.code, id: myId }
    : { role: 'mod', name: r.hostName || 'Host', code: r.code, id: 'mod' };
}

async function joinGame() {
  unlockAudio();
  const name = (document.getElementById('pname').value || '').trim();
  const code = (document.getElementById('pcode').value || '').trim();
  if (!name) { toast('Enter your name'); return; }
  if (code.length !== 4) { toast('Enter 4-digit code'); return; }

  try {
    const snap = await db.ref('rooms/' + code).get();
    if (!snap.exists()) { toast('Room not found'); return; }
    const existing = Object.values(snap.val().players || {});
    if (existing.some(n => String(typeof n === 'object' ? n.name : n).trim().toLowerCase() === name.toLowerCase())) {
      toast('Name already taken'); return;
    }
    const id = uid();
    const up = {};
    up['rooms/' + code + '/players/' + id] = { name, ready: false };
    up['rooms/' + code + '/scores/' + id] = 0;
    await db.ref().update(up);

    ME = { role: 'player', name, code, id };
    subscribeRoom(code);
  } catch(e) {
    toast('Network connection error');
  }
}

function returnToLauncher() {
  stopTicking(); stopEngine(); stopUITick(); unsubscribeRoom();
  const urlParams = new URLSearchParams(window.location.search);
  const room = urlParams.get('room') || ME.code || '';
  const name = urlParams.get('name') || ME.name || '';
  const isHost = urlParams.get('isHost') === 'true' || ME.role === 'mod';

  if (isHost && db && room) {
    db.ref(`master_rooms/${room}`).update({ status: 'LOBBY', launchedGame: null });
  }
  window.location.href = `index.html?room=${room}&name=${encodeURIComponent(name)}&isHost=${isHost}`;
}

async function joinFromLauncher(roomCode, pName, pId, isHostFlag) {
  ME = { role: isHostFlag ? 'mod' : 'player', name: pName, code: roomCode, id: isHostFlag ? 'mod' : (pId || uid()) };

  if (typeof db !== 'undefined' && roomCode) {
    db.ref(`master_rooms/${roomCode}/status`).on('value', snap => {
      if (snap.val() === 'LOBBY' || snap.val() === 'DISBANDED') {
        if (ME.role !== 'mod') returnToLauncher();
      }
    });
  }

  if (isHostFlag) { 
    initHostRoomInFirebase();
    return; 
  }

  if (db) {
    await db.ref(`rooms/${roomCode}/players/${ME.id}`).update({
      name: pName,
      ready: false
    });
  }

  subscribeRoom(roomCode);
}

function renderResults(r) {

                 (r.players && r.players[ME.id] && r.players[ME.id].isHost) ||

async function restartGameSetup(r) {
  if (!r || !r.code) return;
  const currentPlayers = r.players || {};
  const resetPlayers = {};
  
  Object.entries(currentPlayers).forEach(([pid, p]) => {
    const pObj = typeof p === 'object' ? p : { name: p };
    resetPlayers[pid] = {
      ...pObj,
      ready: pObj.isHost ? true : false
    };
  });

  // Explicitly restore host role locally
  if (r.hostName && ME.name && r.hostName.toLowerCase() === ME.name.toLowerCase()) {
    ME.role = 'mod';
  }

  await db.ref('rooms/' + r.code).update({
    phase: 'setup',
    started: false,
    finished: false,
    qIndex: 0,
    aiQ: null,
    buzzedBy: null,
    buzzedAt: null,
    result: null,
    answers: null,
    showAnswer: false,
    options: null,
    players: resetPlayers,
    scores: {}
  });
}

          <div class="result-text">${title}</div>
          <div class="result-sub">${ptsText}Correct Answer: ${esc(q.a)}</div>
        </div>
        <div class="opts" style="margin-top:10px">
          ${opts.map((o, i) => `<button class="optbtn ${o === q.a ? 'correct' : (my && my.choice === o ? 'wrongpick' : '')}" disabled>
            <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
        </div>`;
      return;
    } else {
      const ok = my && my.choice === q.a;
      const correct = Object.entries(ans).filter(([id, a]) => a.choice === q.a).sort((a, b) => a[1].at - b[1].at);
      const myRank = correct.findIndex(([id]) => id === ME.id);
      const pts = ok ? pointsFor(r, myRank) : 0;

      app.innerHTML = `${head}
        <div class="result-banner ${ok ? 'result-correct' : 'result-wrong'}">
          <div class="result-emoji">${ok ? '✅' : '❌'}</div>
          <div class="result-text">${ok ? (myRank === 0 ? '⚡ Fastest!' : 'Correct!') : 'Wrong'}</div>
          <div class="result-sub">${r.suspense ? '' : (ok ? '+' + pts + ' Points' : '')} Answer: ${esc(q.a)}</div>
        </div>
        <div class="opts" style="margin-top:10px">
          ${opts.map((o, i) => `<button class="optbtn ${o === q.a ? 'correct' : (my && my.choice === o ? 'wrongpick' : '')}" disabled>
            <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
        </div>`;
      return;
    }
  }

  const sig = 'O' + r.qIndex + r.code;
  const needType = typedSig !== sig;

  if (r.mode === 'buzzer') {
    const buzzed = !!r.buzzedBy, mine = r.buzzedBy === ME.id;
    const bData = buzzed ? playersObj(r)[r.buzzedBy] : '';
    const bName = bData ? (typeof bData === 'object' ? bData.name : bData) : 'Player';

    if (buzzed && mine && !my) {
      app.innerHTML = `${head}
        ${dblBanner(r)}
        <div class="qbox"><span class="cat-chip">${esc(q.c)}</span><div class="qtext" id="qtext"></div></div>
        <div id="timerHolder">${timerHTML(r)}</div>
        <div class="status">🎉 You buzzed first — pick your answer!</div>
        <div class="opts">
          ${opts.map((o, i) => `<button class="optbtn" data-o="${esc(o)}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
        </div>`;
      const el0 = document.getElementById('qtext');
      if (needType) { typedSig = sig; typeText(el0, q.q); } else el0.textContent = q.q;
      document.querySelectorAll('.optbtn').forEach(b => bindTap(b, () => pickAnswer(b.dataset.o)));
      return;
    }

    app.innerHTML = `${head}
      ${dblBanner(r)}
      <div class="qbox"><span class="cat-chip">${esc(q.c)}</span><div class="qtext" id="qtext"></div></div>
      <div id="timerHolder">${timerHTML(r)}</div>
      <div class="status">${buzzed ? (mine ? '🎉 YOU BUZZED FIRST!' : '🔒 ' + esc(bName) + ' BUZZED FIRST!') : 'Hit the buzzer!'}</div>
      <div class="buzzer"><button class="bz ${mine ? 'mine' : (buzzed ? 'locked' : '')}" id="bz" ${buzzed ? 'disabled' : ''}>${mine ? 'YOU!' : (buzzed ? '🔒' : 'BUZZ')}</button></div>`;
    const el1 = document.getElementById('qtext');
    if (needType) { typedSig = sig; typeText(el1, q.q); } else el1.textContent = q.q;
    const bzEl = document.getElementById('bz');
    if (bzEl && !buzzed) bindTap(bzEl, onlineBuzz);
    return;
  }

  app.innerHTML = `${head}
    ${dblBanner(r)}
    <div class="qbox"><span class="cat-chip">${esc(q.c)}</span><div class="qtext" id="qtext"></div></div>
    <div id="timerHolder">${timerHTML(r)}</div>
    <div class="opts">
      ${opts.map((o, i) => `<button class="optbtn ${my && my.choice === o ? 'picked' : ''}" data-o="${esc(o)}" ${my ? 'disabled' : ''}>
        <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>`;

  const el = document.getElementById('qtext');
  if (needType) { typedSig = sig; typeText(el, q.q); } else el.textContent = q.q;
  if (!my) document.querySelectorAll('.optbtn').forEach(b => bindTap(b, () => pickAnswer(b.dataset.o)));
}

async function onlineBuzz() {
  unlockAudio();
  if (navigator.vibrate) navigator.vibrate(60);
  try {
    const res = await db.ref('rooms/' + ME.code + '/buzzedBy').transaction(cur => {
      if (cur === null || cur === undefined) return ME.id;
      return;
    });
    if (res.committed && res.snapshot.val() === ME.id) {
      await db.ref('rooms/' + ME.code + '/buzzedAt').set(firebase.database.ServerValue.TIMESTAMP);
    }
  } catch(e) {}
}

async function pickAnswer(val) {
  unlockAudio();
  if (!ME.code || !ME.id || !lastRoom) return;
  const tapAt = serverNow();
  try {
    await db.ref('rooms/' + ME.code + '/answers/' + ME.id).set({ choice: val, at: tapAt });
    sTick();
  } catch(e) {}
}

function renderMod(r) {
  if (r.finished) { renderResults(r); return; }
  const players = Object.entries(realPlayersObj(r));
  const q = currentQ(r);

  if (!q.valid) {
    screenGenerating('Syncing Question...');
    return;
  }

  if (!r.started) {
    app.innerHTML = `
      <div class="modbar"><div><div class="sub">Host Control</div><div class="pin">#${r.code}</div></div></div>
      <div class="qbox center"><div class="ans-label">Room Code</div><div style="font-size:40px;font-weight:900;color:var(--gold)">${r.code}</div></div>
      <div class="scores"><div class="ans-label">Players Joined (${players.length})</div>
        ${players.map(([id, p]) => `<div class="srow"><span>👤 ${esc(p && typeof p === 'object' ? p.name : p)}</span></div>`).join('')}
      </div>
      <button class="btn btn-gold" id="start" ${players.length ? '' : 'disabled'} style="margin-top:auto">Start Game</button>`;
    const s = document.getElementById('start');
    if (s) s.onclick = () => db.ref('rooms/' + ME.code).update({ started: true, qIndex: 0, revealed: false });
    return;
  }

  if (r.mode === 'fff') {
    const ansMap = answersObj(r);
    const got = Object.keys(ansMap).length;
    const totalPlayers = players.length;
    const allAnswered = totalPlayers > 0 && got >= totalPlayers;

    app.innerHTML = `
      <div class="modbar"><div><div class="sub">Host Control</div></div><div class="qprog">Q ${r.qIndex + 1}/${deckLen(r)}</div></div>
      <div class="qbox"><span class="cat-chip">${esc(q.c)}</span><div class="qtext">${esc(q.q)}</div></div>
      <div class="ans"><div class="ans-label">Correct Answer</div><div class="ans-text">${esc(q.a)}</div></div>
      ${r.revealed ? `<div id="timerHolder">${timerHTML(r)}</div>
        <div class="status" style="margin-top:6px;">📥 Answers: ${got}/${totalPlayers} Players</div>` : ''}
      ${!r.revealed ? `<button class="btn ${r.dbl ? 'btn-teal' : 'btn-ghost'}" id="dbl" style="margin-top:8px">${r.dbl ? '✖️2 DOUBLE POINTS ON' : '✖️2 Make Double Round'}</button>` : ''}
      ${!r.revealed ? `<button class="btn btn-gold" id="rev">Reveal Question</button>` : ''}
      ${r.revealed && !r.showAnswer ? `<button class="btn ${allAnswered ? 'btn-teal' : 'btn-gold'}" id="lock" style="margin-top:8px;">Show Answer &amp; Points ${allAnswered ? '✅ (All Answered)' : ''}</button>` : ''}
      ${r.showAnswer ? `<button class="btn btn-gold" id="next">Next Question ›</button>` : ''}`;

    const dbl = document.getElementById('dbl'); if (dbl) dbl.onclick = () => db.ref('rooms/' + ME.code).update({ dbl: !r.dbl });
    const rev = document.getElementById('rev'); if (rev) rev.onclick = () => db.ref('rooms/' + ME.code).update({ revealed: true, options: optionsForRoom(r), revealedAt: firebase.database.ServerValue.TIMESTAMP });
    const lock = document.getElementById('lock'); if (lock) lock.onclick = fffLock;
    const next = document.getElementById('next'); if (next) next.onclick = () => modNav(1);
  } else {
    /* HOSTED BUZZER STATE MACHINE */
    const res = r.result;
    const bData = r.buzzedBy ? playersObj(r)[r.buzzedBy] : null;
    const bName = bData ? (typeof bData === 'object' ? bData.name : bData) : 'Player';

    let actionContent = '';

    if (res) {
      actionContent = `
        <div class="result-banner ${res.correct ? 'result-correct' : 'result-wrong'}">
          <div class="result-emoji">${res.correct ? '✅' : '❌'}</div>
          <div class="result-text">${esc(res.winnerName)} ${res.correct ? 'was Correct!' : 'was Wrong!'}</div>
          <div class="result-sub">${res.pts >= 0 ? '+' + res.pts : res.pts} Points | Correct Answer: ${esc(q.a)}</div>
        </div>
        <button class="btn btn-gold" id="next" style="margin-top:12px">Next Question ›</button>
      `;
    } else if (r.buzzedBy) {
      const gain = r.dbl ? 20 : 10;
      const penalty = (r.neg || 0) * (r.dbl ? 2 : 1);
      actionContent = `
        <div class="buzzed">
          <div class="who">🔔 ${esc(bName)} BUZZED!</div>
          <div id="timerHolder">${timerHTML(r)}</div>
          <div class="row" style="margin-top:8px">
            <button class="btn btn-teal" id="ok">Correct (+${gain})</button>
            <button class="btn btn-cerise" id="no">Wrong ${r.neg ? '(−' + penalty + ')' : ''}</button>
          </div>
        </div>
      `;
    } else if (r.revealed) {
      actionContent = `
        <div class="status" style="margin-top:10px">Question sent! Waiting for buzzes...</div>
        <button class="btn btn-ghost" id="next" style="margin-top:10px">Skip Question ›</button>
      `;
    } else {
      actionContent = `
        <button class="btn ${r.dbl ? 'btn-teal' : 'btn-ghost'}" id="dbl" style="margin-top:8px">${r.dbl ? '✖️2 DOUBLE POINTS ON' : '✖️2 Make Double Round'}</button>
        <button class="btn btn-gold" id="reveal" style="margin-top:8px">🚀 Reveal / Send Question</button>
      `;
    }

    app.innerHTML = `
      <div class="modbar">
        <div><div class="sub">Host Buzzer Control</div></div>
        <div class="qprog">Q ${r.qIndex + 1}/${deckLen(r)}</div>
      </div>
      <div class="qbox">
        <span class="cat-chip">${esc(q.c)}</span>
        <div class="qtext">${esc(q.q)}</div>
      </div>
      <div class="ans">
        <div class="ans-label">Correct Answer</div>
        <div class="ans-text">${esc(q.a)}</div>
      </div>
      ${actionContent}
    `;

    const dbl = document.getElementById('dbl'); if (dbl) dbl.onclick = () => db.ref('rooms/' + ME.code).update({ dbl: !r.dbl });
    const reveal = document.getElementById('reveal'); if (reveal) reveal.onclick = () => db.ref('rooms/' + ME.code).update({ revealed: true, revealedAt: firebase.database.ServerValue.TIMESTAMP, buzzedBy: null, result: null });
    const ok = document.getElementById('ok'); if (ok) ok.onclick = () => modJudge(true);
    const no = document.getElementById('no'); if (no) no.onclick = () => modJudge(false);
    const next = document.getElementById('next'); if (next) next.onclick = () => modNav(1);
  }
}

async function fffLock() {
  const r = lastRoom, q = currentQ(r), ans = answersObj(r);
  const correct = Object.entries(ans).filter(([id, a]) => a.choice === q.a).sort((a, b) => a[1].at - b[1].at);
  const up = {};
  correct.forEach(([id], i) => {
    const pts = fffPointsFor(i) * (r.dbl ? 2 : 1);
    up['rooms/' + ME.code + '/scores/' + id] = (scoresObj(r)[id] || 0) + pts;
  });
  up['rooms/' + ME.code + '/showAnswer'] = true;
  await db.ref().update(up);
}

async function modJudge(correct) {
  const r = lastRoom, bid = r.buzzedBy;
  if (!bid) return;
  const bData = playersObj(r)[bid];
  const bName = bData ? (typeof bData === 'object' ? bData.name : bData) : 'Player';
  
  const gain = r.dbl ? 20 : 10;
  const penalty = (r.neg || 0) * (r.dbl ? 2 : 1);
  const pts = correct ? gain : -penalty;

  const up = {};
  up['rooms/' + ME.code + '/scores/' + bid] = (scoresObj(r)[bid] || 0) + pts;
  up['rooms/' + ME.code + '/result'] = {
    winnerId: bid,
    winnerName: bName,
    correct: correct,
    pts: pts
  };
  await db.ref().update(up);
}

async function modNav(d) {
  const r = lastRoom;
  if (r.qIndex + d >= deckLen(r)) {
    await db.ref('rooms/' + ME.code).update({ finished: true });
    return;
  }
  await db.ref('rooms/' + ME.code).update({
    qIndex: Math.max(0, r.qIndex + d),
    revealed: false,
    revealedAt: null,
    buzzedBy: null,
    buzzedAt: null,
    result: null,
    answers: null,
    showAnswer: false,
    options: null,
    dbl: false
  });
}

let typedSig = null, typeTimer = null;
let typingDone = true;
function typeText(el, text, onDone) {
  if (!el) return;
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  typingDone = false;
  el.textContent = '';
  const cur = document.createElement('span'); cur.className = 'typecursor'; el.appendChild(cur);
  let i = 0;
  typeTimer = setInterval(() => {
    if (i >= text.length) {
      clearInterval(typeTimer); typeTimer = null;
      if (cur.parentNode) cur.remove();
      typingDone = true;
      if (typeof onDone === 'function') onDone();
      return;
    }
    cur.insertAdjacentText('beforebegin', text[i]); i++;
  }, 16);
}

function renderPlayer(r) {
  if (r.finished) { renderResults(r); return; }
  const q = currentQ(r);
  const opts = r.options || [];
  const ans = answersObj(r);
  const my = ans[ME.id];

  if (!q.valid) {
    screenGenerating('Syncing Question...');
    return;
  }

  if (!r.started) {
    app.innerHTML = `<div class="qbox center" style="margin:auto"><div style="font-size:38px">⏳</div><div class="qtext">Waiting for host to start…</div></div>`;
    return;
  }

  if (r.mode === 'fff') {
    if (r.showAnswer) {
      const ok = my && my.choice === q.a;
      const correctSorted = Object.entries(ans).filter(([id, a]) => a.choice === q.a).sort((a, b) => a[1].at - b[1].at);
      const myRank = correctSorted.findIndex(([id]) => id === ME.id);
      const pts = ok ? fffPointsFor(myRank) * (r.dbl ? 2 : 1) : 0;

      app.innerHTML = `<div class="result-banner ${ok ? 'result-correct' : 'result-wrong'}" style="margin:auto">
        <div class="result-emoji">${ok ? '✅' : '❌'}</div>
        <div class="result-text">${ok ? (myRank === 0 ? '⚡ Fastest!' : '#' + (myRank + 1) + ' Fastest!') : 'Wrong'}</div>
        <div class="result-sub">${r.suspense ? '' : (ok ? '+' + pts + ' Points' : '')} Answer: ${esc(q.a)}</div>
      </div>`;
      return;
    }
    if (!r.revealed) {
      app.innerHTML = `<div class="getready" style="margin:auto"><div class="big">👂</div><div class="qtext">Get ready…</div></div>`;
      return;
    }
    app.innerHTML = `
      <div class="qbox"><span class="cat-chip">${esc(q.c)}</span><div class="qtext">${esc(q.q)}</div></div>
      <div id="timerHolder">${timerHTML(r)}</div>
      <div class="opts">
        ${opts.map((o, i) => `<button class="optbtn ${my && my.choice === o ? 'picked' : ''}" data-o="${esc(o)}" ${my ? 'disabled' : ''}>
          <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
      </div>`;
    if (!my) document.querySelectorAll('.optbtn').forEach(b => bindTap(b, () => pickAnswer(b.dataset.o)));
  } else {
    /* HOSTED BUZZER PLAYER STATE MACHINE */
    const res = r.result;
    const buzzed = !!r.buzzedBy, mine = r.buzzedBy === ME.id;
    const bData = buzzed ? playersObj(r)[r.buzzedBy] : null;
    const bName = bData ? (typeof bData === 'object' ? bData.name : bData) : 'Player';

    if (res) {
      const isWinner = res.winnerId === ME.id;
      const bannerClass = res.correct ? 'result-correct' : 'result-wrong';
      const emoji = res.correct ? '✅' : '❌';
      let title = '';
      let subText = '';

      if (isWinner) {
        title = res.correct ? 'You were Correct!' : 'You were Wrong!';
        subText = `${res.pts >= 0 ? '+' + res.pts : res.pts} Points | Correct Answer: ${esc(q.a)}`;
      } else {
        title = res.correct ? `${esc(res.winnerName)} guessed right!` : `${esc(res.winnerName)} guessed wrong!`;
        subText = `Correct Answer: ${esc(q.a)}`;
      }

      app.innerHTML = `
        <div class="result-banner ${bannerClass}" style="margin:auto">
          <div class="result-emoji">${emoji}</div>
          <div class="result-text">${title}</div>
          <div class="result-sub">${subText}</div>
        </div>
      `;
      return;
    }

    if (!r.revealed) {
      app.innerHTML = `
        <div class="getready" style="margin:auto">
          <div class="big">👂</div>
          <div class="qtext">Get ready…</div>
          <div class="sub">Host is reviewing question</div>
        </div>
      `;
      return;
    }

    app.innerHTML = `
      <div class="qbox"><span class="cat-chip">${esc(q.c)}</span><div class="qtext">${esc(q.q)}</div></div>
      <div id="timerHolder">${timerHTML(r)}</div>
      <div class="status">${buzzed ? (mine ? '🎉 YOU BUZZED FIRST!' : '🔒 ' + esc(bName) + ' BUZZED FIRST!') : 'Hit the buzzer!'}</div>
      <div class="buzzer">
        <button class="bz ${mine ? 'mine' : (buzzed ? 'locked' : '')}" id="bz" ${buzzed ? 'disabled' : ''}>
          ${mine ? 'YOU!' : (buzzed ? '🔒' : 'BUZZ')}
        </button>
      </div>
    `;

    const b = document.getElementById('bz');
    if (b && !buzzed) bindTap(b, onlineBuzz);
  }
}

screenHome();
</script>
