<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AK Quiz Night</title>
<style>
  :root{
    /* Palette: yellow primary, everything else black / white / grey */
    --yellow:#FFC82A;
    --paper:#FFC82A;      /* page background */
    --ink:#111111;        /* black */
    --card:#FFFFFF;
    --muted:#6B6B6B;      /* grey */
    --line:#D8D8D8; --green:#22B34B;
    /* legacy names kept so existing markup still resolves */
    --gold:#FFC82A; --gold-deep:#111111;
    --cerise:#111111; --teal:#2E2E2E; --violet:#111111;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    background:var(--paper);color:var(--ink);
    -webkit-user-select:none;user-select:none;
    overflow-x:hidden;
  }
  /* Fit to the phone: dynamic viewport height avoids browser-chrome overflow */
  .wrap{
    max-width:520px;margin:0 auto;
    min-height:100dvh;height:100dvh;
    display:flex;flex-direction:column;
    padding:clamp(8px,2.5vw,16px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  h1{font-size:clamp(22px,7vw,32px);margin:0;line-height:.98;letter-spacing:-1px;font-weight:900;}
  .z{color:var(--ink);background:var(--card);padding:0 6px;border-radius:6px;}
  .sub{color:var(--ink);opacity:.7;font-size:clamp(10px,2.9vw,13px);margin-top:5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;}
  .home-hero{text-align:center;padding:clamp(8px,3vw,20px) 0 4px;}
  .bolt{font-size:clamp(34px,11vw,56px);line-height:1;}

  .card{background:var(--card);border:3px solid var(--ink);border-radius:16px;
        padding:clamp(10px,2.8vw,15px);margin-top:clamp(6px,2vw,12px);box-shadow:4px 4px 0 var(--ink);}
  label{display:block;font-weight:800;font-size:clamp(10px,2.9vw,13px);margin:0 0 5px;text-transform:uppercase;letter-spacing:.5px;}
  input{width:100%;font-size:clamp(15px,4.4vw,20px);padding:clamp(7px,2.2vw,11px);
        border:3px solid var(--ink);border-radius:10px;background:#fff;font-family:inherit;
        font-weight:800;text-align:center;letter-spacing:2px;text-transform:uppercase;color:var(--ink);}
  input:focus{outline:none;background:var(--yellow);}

  .btn{touch-action:manipulation;width:100%;border:3px solid var(--ink);border-radius:11px;
       padding:clamp(8px,2.3vw,12px);font-size:clamp(13px,3.6vw,16px);font-weight:900;
       font-family:inherit;cursor:pointer;margin-top:8px;box-shadow:3px 3px 0 var(--ink);
       transition:transform .05s,box-shadow .05s;background:#fff;color:var(--ink);}
  .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-gold{background:var(--ink);color:#fff;}          /* primary = black on yellow */
  .btn-teal{background:var(--ink);color:#fff;}
  .btn-cerise{background:#fff;color:var(--ink);}
  .btn-ghost{background:#fff;color:var(--ink);}
  .btn-sm{padding:clamp(7px,2.2vw,10px) 12px;font-size:clamp(11px,3.2vw,14px);box-shadow:3px 3px 0 var(--ink);margin-top:0;width:auto;}
  .row{display:flex;gap:8px;}
  .row .btn{margin-top:0;}
  .divider{text-align:center;font-size:11px;margin:10px 0 2px;font-weight:800;letter-spacing:2px;opacity:.75;}
  .tag{display:inline-block;background:var(--ink);color:#fff;font-size:10px;font-weight:800;
       padding:4px 10px;border-radius:99px;letter-spacing:1px;text-transform:uppercase;}
  .hint{font-size:clamp(10px,2.9vw,12px);color:var(--muted);margin-top:8px;line-height:1.45;}

  .cat-chip{display:inline-block;font-size:clamp(9px,2.7vw,12px);font-weight:800;padding:4px 11px;
            border-radius:99px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--ink);}
  .qbox{background:var(--card);border:3px solid var(--ink);border-radius:16px;
        padding:clamp(11px,3vw,18px);box-shadow:4px 4px 0 var(--ink);margin-top:clamp(6px,2vw,11px);}
  .qnum{font-size:clamp(9px,2.7vw,12px);color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase;}
  .qtext{font-size:clamp(16px,4.9vw,23px);font-weight:800;line-height:1.22;margin-top:8px;}

  .buzzer{margin-top:auto;padding:clamp(8px,2.5vw,18px) 0 4px;display:flex;justify-content:center;}
  .bz{touch-action:manipulation;width:min(100%,34vh);aspect-ratio:1/1;border-radius:50%;border:5px solid var(--ink);
      background:var(--card);color:var(--ink);font-size:clamp(28px,9vw,46px);font-weight:900;letter-spacing:2px;
      box-shadow:0 9px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s;}
  .bz:active{transform:translateY(7px);box-shadow:0 2px 0 var(--ink);}
  .bz.locked{background:#BDBDBD;color:#fff;box-shadow:0 7px 0 #4a4a4a;cursor:default;}
  .bz.mine{background:var(--ink);color:var(--yellow);box-shadow:0 9px 0 #000;}
  .status{text-align:center;font-size:clamp(12px,3.6vw,16px);font-weight:800;margin-top:8px;min-height:18px;}
  @keyframes pl{50%{opacity:.4;}}

  .modbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
  .pin{font-size:clamp(18px,6vw,24px);font-weight:900;letter-spacing:4px;}
  .ans{background:var(--ink);color:#fff;border:3px solid var(--ink);border-radius:12px;
       padding:clamp(9px,2.8vw,14px) 14px;margin-top:10px;box-shadow:4px 4px 0 #00000055;}
  .ans-label{font-size:clamp(9px,2.6vw,11px);font-weight:800;letter-spacing:1px;text-transform:uppercase;}
  .ans-text{font-size:clamp(15px,4.6vw,21px);font-weight:900;margin-top:3px;color:var(--yellow);}
  .buzzed{background:var(--card);border:3px solid var(--ink);border-radius:12px;
          padding:clamp(10px,3vw,16px);margin-top:10px;box-shadow:4px 4px 0 var(--ink);text-align:center;}
  .buzzed .who{font-size:clamp(18px,5.6vw,25px);font-weight:900;}
  .buzzed.none{background:transparent;color:var(--muted);box-shadow:none;border-style:dashed;}

  .scores{margin-top:10px;}
  .srow{display:flex;align-items:center;justify-content:space-between;background:var(--card);
        border:2px solid var(--ink);border-radius:10px;padding:clamp(6px,2.2vw,10px) 12px;
        margin-bottom:6px;font-weight:800;font-size:clamp(12px,3.6vw,15px);}
  .srow .pts{background:var(--ink);color:#fff;border-radius:99px;padding:2px 11px;min-width:40px;text-align:center;}
  .lead{box-shadow:3px 3px 0 var(--ink);}
  .qprog{font-size:clamp(9px,2.6vw,12px);font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;margin-top:4px;opacity:.75;}
  .mini{font-size:clamp(10px,2.9vw,12px);color:var(--muted);text-align:center;margin-top:8px;}
  .pill-live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:pl 1s infinite;}
  .center{text-align:center;}
  .backlink{background:none;border:none;color:var(--ink);opacity:.6;font-weight:800;
            font-size:clamp(11px,3.2vw,13px);cursor:pointer;padding:6px;font-family:inherit;}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:11px 18px;border-radius:99px;font-weight:800;font-size:13px;opacity:0;
         transition:opacity .25s;pointer-events:none;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .setup{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:14px;margin-top:12px;font-size:12px;line-height:1.5;}
  .setup code{background:var(--yellow);padding:1px 5px;border-radius:4px;}
  .setup a{color:var(--ink);font-weight:800;}
  .conn{position:fixed;top:6px;right:6px;font-size:9px;font-weight:800;padding:3px 8px;
        border-radius:99px;background:#ffffffcc;color:var(--muted);z-index:40;}
  .conn.ok{background:var(--ink);color:#fff;}

  .timer{margin-top:8px;text-align:center;}
  .timer-num{font-size:clamp(24px,8vw,40px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .timer-num.warn{animation:pl .5s ease-in-out infinite;}
  .timer-bar{height:10px;border:2px solid var(--ink);border-radius:99px;background:#fff;margin-top:5px;overflow:hidden;}
  .timer-fill{height:100%;background:var(--ink);width:100%;}
  .timer-fill.warn{background:#7a7a7a;}
  .timer-label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
  .timeup{font-weight:900;font-size:clamp(15px,4.6vw,20px);}

  .rank-hero{text-align:center;padding:6px 0 2px;}
  .rank-hero .trophy{font-size:clamp(32px,10vw,52px);}
  .rank-row{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--ink);
            border-radius:12px;padding:clamp(7px,2.4vw,12px) 12px;margin-bottom:7px;box-shadow:4px 4px 0 var(--ink);}
  .rank-pos{font-size:clamp(15px,4.8vw,21px);font-weight:900;min-width:32px;text-align:center;}
  .rank-name{flex:1;font-weight:800;font-size:clamp(13px,4vw,17px);}
  .rank-pts{background:var(--ink);color:#fff;border-radius:99px;padding:3px 12px;font-weight:900;font-size:clamp(12px,3.6vw,15px);}
  .rank-1{background:var(--yellow);}
  .rank-2{background:#EDEDED;}
  .rank-3{background:#F7F7F7;}
  .you-badge{font-size:9px;font-weight:800;background:var(--ink);color:#fff;padding:2px 6px;border-radius:99px;margin-left:5px;}

  .result-banner{border:3px solid var(--ink);border-radius:14px;padding:clamp(12px,3.6vw,20px);
                 text-align:center;margin-top:10px;box-shadow:5px 5px 0 var(--ink);background:var(--card);}
  .result-correct{background:#22B34B;color:#fff;border-color:#0E7A31;}
  .result-correct .result-sub{color:#DFF5E6;}
  .result-wrong{background:var(--ink);color:#fff;}
  .result-wrong .result-sub{color:#c9c9c9;}
  .result-emoji{font-size:clamp(32px,10vw,50px);line-height:1;}
  .result-text{font-size:clamp(17px,5.4vw,25px);font-weight:900;margin-top:4px;}
  .result-sub{font-size:clamp(11px,3.4vw,14px);font-weight:700;color:var(--muted);margin-top:3px;}

  .getready{text-align:center;padding:clamp(12px,4vw,26px) 12px;}
  .getready .big{font-size:clamp(30px,11vw,42px);}
  .typecursor{display:inline-block;width:3px;height:1em;background:var(--ink);margin-left:2px;
              vertical-align:text-bottom;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{border:2px solid var(--ink);background:#fff;border-radius:99px;
        padding:clamp(4px,1.5vw,7px) clamp(7px,2.2vw,11px);font-size:clamp(10px,2.8vw,12px);
        font-weight:800;font-family:inherit;cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink);}
  .chip.on{background:var(--ink);color:#fff;}
  .seg{display:flex;gap:6px;margin-top:6px;}
  .seg .segbtn{flex:1;border:3px solid var(--ink);background:#fff;border-radius:10px;
               padding:clamp(6px,2vw,10px) 5px;font-weight:900;font-family:inherit;
               font-size:clamp(11px,3.2vw,14px);cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink);}
  .seg .segbtn.on{background:var(--ink);color:#fff;}
  .seg .segbtn small{display:block;font-weight:700;font-size:clamp(8px,2.3vw,10px);color:var(--muted);
                     margin-top:2px;text-transform:none;letter-spacing:0;}
  .seg .segbtn.on small{color:#cfcfcf;}

  .opts{display:flex;flex-direction:column;gap:clamp(5px,1.6vw,8px);margin-top:clamp(6px,2vw,10px);}
  .optbtn{width:100%;border:3px solid var(--ink);background:var(--card);border-radius:12px;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
          padding:clamp(9px,2.6vw,13px);font-size:clamp(13px,3.7vw,16px);font-weight:800;font-family:inherit;
          text-align:left;cursor:pointer;box-shadow:4px 4px 0 var(--ink);color:var(--ink);
          transition:transform .05s,box-shadow .05s;display:flex;align-items:center;gap:10px;}
  .optbtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .optbtn .letter{background:var(--ink);color:#fff;width:26px;height:26px;min-width:26px;border-radius:50%;
                  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;}
  .optbtn.picked{background:var(--ink);color:#fff;}
  .optbtn.picked .letter{background:var(--yellow);color:var(--ink);}
  .optbtn.correct{background:#22B34B;color:#fff;border-color:#0E7A31;border-width:4px;}
  .optbtn.correct .letter{background:#fff;color:#0E7A31;}
  .optbtn.wrongpick{background:#9E9E9E;color:#fff;}
  .optbtn.wrongpick .letter{background:#fff;color:#111;}
  .optbtn:disabled{cursor:default;}
  .answered{background:var(--card);border:3px dashed var(--ink);border-radius:12px;
            padding:clamp(8px,2.6vw,14px);text-align:center;margin-top:10px;font-weight:800;font-size:clamp(12px,3.6vw,15px);}
  .soundbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
  .speed-tag{font-size:10px;font-weight:800;background:var(--yellow);border:1px solid var(--ink);
             border-radius:99px;padding:1px 7px;margin-left:5px;}
  .loading{text-align:center;padding:30px 16px;}
  .spinner{width:44px;height:44px;border:5px solid var(--ink);border-top-color:transparent;
           border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .srcbadge{display:inline-block;font-size:9px;font-weight:800;padding:2px 8px;border-radius:99px;
            background:var(--ink);color:#fff;letter-spacing:.5px;}
</style>
</head>

// pools: category+subtype (most specific), subtype alone, then category+... fallback
const POOL_CS={}, POOL_S={};
ALL.forEach(x=>{
  (POOL_CS[x.c+'|'+x.t]=POOL_CS[x.c+'|'+x.t]||new Set()).add(x.a);
  (POOL_S[x.t]=POOL_S[x.t]||new Set()).add(x.a);
});
Object.entries(EXTRA).forEach(([k,list])=>{
  POOL_S[k]=POOL_S[k]||new Set();
  list.forEach(v=>POOL_S[k].add(v));
});
function optionsFor(idx){
  const x=ALL[idx];
  // 1) same category AND same kind — most thematic
  let pool=[...(POOL_CS[x.c+'|'+x.t]||new Set())].filter(v=>v!==x.a);
  // 2) same kind across all categories (e.g. any woman's name, any film title)
  if(pool.length<3) pool=[...(POOL_S[x.t]||new Set())].filter(v=>v!==x.a);
  const picked=[];
  const p=pool.slice();
  while(picked.length<3&&p.length) picked.push(p.splice(Math.floor(Math.random()*p.length),1)[0]);
  while(picked.length<3) picked.push('—');
  return shuffle([x.a,...picked]);
}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(cats,n){
  const idxs=[];
  ALL.forEach((x,i)=>{ if(cats.includes(x.c)) idxs.push(i); });
  const sh=shuffle(idxs);
  if(!n||n<=0) return sh;
  return sh.slice(0,Math.min(n,sh.length));
}

// Bind a tap that registers the instant a finger touches, bypassing iOS's ~300ms click delay.
function bindTap(el,fn){
  if(!el) return;
  let done=false;
  const fire=(ev)=>{
    if(done) return; done=true;
    ev.preventDefault();
    fn(ev);
  };
  // pointerdown covers modern iOS/Android/desktop; click is a fallback for anything older
  el.addEventListener('pointerdown',fire,{passive:false});
  el.addEventListener('click',fire);
}

/* ============ SOUND (robust unlock) ============ */
let AC=null, soundReady=false;
function ensureAC(){
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return AC;
}
function unlockAudio(){
  const ac=ensureAC(); if(!ac) return;
  if(ac.state==='suspended'){ ac.resume(); }
  if(!soundReady){
    try{
      // silent blip inside a gesture fully unlocks iOS/Safari
      const b=ac.createBuffer(1,1,22050);
      const s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
      soundReady=true;
    }catch(e){}
  }
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, {passive:true});
});
function tone(freq,start,dur,vol,type){
  const ac=ensureAC(); if(!ac) return;
  if(ac.state==='suspended') ac.resume();
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq, ac.currentTime+start);
  const t=ac.currentTime+start;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.03);
}

let tickInterval=null,lastBeepSecond=null,playedTimeUp=false;
function timerStart(r){ // when the countdown began
  if(!r||!r.timeLimit) return null;
  if(r.online) return (r.phase==='question')?r.phaseAt:null;
  if(r.mode==='fff') return r.revealed?r.revealedAt:null;
  return r.buzzedAt||null;
}
function remainingSecs(r){
  const st=timerStart(r);
  if(!r||!r.started||!r.timeLimit||!st) return null;
  if(r.online) return (r.phase==='question')?Math.max(0,r.timeLimit-((serverNow()-st)/1000)):null;
  if(r.mode==='fff' && r.showAnswer) return null;
  if(r.mode!=='fff' && r.result) return null;
  return Math.max(0, r.timeLimit-((serverNow()-st)/1000));
}
function startTicking(){
  if(tickInterval) return;
  tickInterval=setInterval(()=>{
    const r=lastRoom;
    const rem=remainingSecs(r);
    if(rem===null){lastBeepSecond=null;playedTimeUp=false;return;}
    const whole=Math.ceil(rem);
    const win=(r.timeLimit<=5)?2:5;
    if(ME.role==='player'){
      const answered = r.mode==='fff' && answersObj(r)[ME.id];
      if(!answered){
        if(rem>0&&whole<=win&&whole!==lastBeepSecond){lastBeepSecond=whole;sBeep();}
        if(rem<=0&&!playedTimeUp){playedTimeUp=true;sTimeUp();}
      }
    }
    const h=document.getElementById('timerHolder');
    if(h) h.innerHTML=timerHTML(r);
  },250);
}

  },500);
}
function stopUITick(){ if(uiTimer){clearInterval(uiTimer);uiTimer=null;}

function stopTicking(){if(tickInterval){clearInterval(tickInterval);tickInterval=null;}lastBeepSecond=null;playedTimeUp=false;}
function timerHTML(r){
  const rem=remainingSecs(r);
  if(rem===null) return '';
  const warn=rem<=((r.timeLimit<=5)?2:5);
  const pct=Math.max(0,Math.min(100,(rem/r.timeLimit)*100));
  if(rem<=0) return `<div class="timer"><div class="timeup">⏰ Time's up!</div></div>`;
  return `<div class="timer">
    <div class="timer-label">Time to answer</div>
    <div class="timer-num ${warn?'warn':''}">${Math.ceil(rem)}s</div>
    <div class="timer-bar"><div class="timer-fill ${warn?'warn':''}" style="width:${pct}%"></div></div>
  </div>`;
}

/* ============ ONLINE MODE ENGINE ============ */
/* The clock is derived from Firebase's SERVER timestamp, not any one device.
   Every client checks whether a phase is due; a transaction on `seq` makes sure
   exactly one of them performs the transition. If the creator closes their tab,
   the game keeps running. */
const COUNTDOWN_S=3, REVEAL_S=5, BUZZ_ANSWER_S=10;
let engineTimer=null;
function pointsFor(r,rank){
  const base = r.mode==='buzzer' ? (rank===0?10:0) : fffPointsFor(rank);
  return r.dbl ? base*2 : base;
}
function startEngine(){ if(!engineTimer) engineTimer=setInterval(engineTick,350); }
function stopEngine(){ if(engineTimer){clearInterval(engineTimer);engineTimer=null;} }

// Atomically claim the right to advance the game. Returns true if we won.
async function claim(r){
  try{
    const res=await db.ref('rooms/'+ME.code+'/seq').transaction(cur=>{
      const now=(cur==null)?0:cur;
      if(now!==(r.seq||0)) return;      // someone else already moved it on
      return now+1;
    });
    return !!res.committed;
  }catch(e){ return false; }
}

async function engineTick(){
  const r=lastRoom;
  if(!r||!r.online||!r.started||r.finished||!r.phaseAt) return;
  maybeTopUp(r);
  const el=(serverNow()-r.phaseAt)/1000;
  const players=Object.keys(playersObj(r)).length;

  if(r.phase==='countdown'){
    if(el>=COUNTDOWN_S && await claim(r)) await onlineStartQuestion(r);
    return;
  }
  if(r.phase==='question'){
    if(r.mode==='buzzer'){
      // someone buzzed: they get an exclusive answer window
      if(r.buzzedBy){
        const since=(serverNow()-(r.buzzedAt||serverNow()))/1000;
        const answered=answersObj(r)[r.buzzedBy];
        if((answered||since>=BUZZ_ANSWER_S) && await claim(r)) await onlineEndQuestion(r);
      } else if(el>=r.timeLimit && await claim(r)){
        await onlineEndQuestion(r);      // nobody buzzed in time
      }
    } else {
      const got=Object.keys(answersObj(r)).length;
      if((el>=r.timeLimit || (players>0&&got>=players)) && await claim(r)) await onlineEndQuestion(r);
    }
    return;
  }
  if(r.phase==='reveal'){
    if(el>=REVEAL_S && await claim(r)) await onlineNext(r);
  }
}

async function onlineStartQuestion(r){
  await db.ref('rooms/'+ME.code).update({
    phase:'question', phaseAt:firebase.database.ServerValue.TIMESTAMP,
    options:optionsForRoom(r), answers:null, showAnswer:false, revealed:true,
    buzzedBy:null, buzzedAt:null
  });
}
async function onlineEndQuestion(r){
  const q=currentQ(r), ans=answersObj(r);
  const up={};
  if(r.mode==='buzzer'){
    // only the player who buzzed could answer
    const bid=r.buzzedBy;
    const a=bid?ans[bid]:null;
    if(a && a.choice===q.a){
      up['rooms/'+ME.code+'/scores/'+bid]=(scoresObj(r)[bid]||0)+(r.dbl?20:10);
    }
  } else {
    const correct=Object.entries(ans).filter(([id,a])=>a.choice===q.a).sort((a,b)=>a[1].at-b[1].at);
    correct.forEach(([id],i)=>{
      const pts=pointsFor(r,i);
      if(pts>0) up['rooms/'+ME.code+'/scores/'+id]=(scoresObj(r)[id]||0)+pts;
    });
  }
  up['rooms/'+ME.code+'/showAnswer']=true;
  up['rooms/'+ME.code+'/phase']='reveal';
  up['rooms/'+ME.code+'/phaseAt']=firebase.database.ServerValue.TIMESTAMP;
  await db.ref().update(up);
}
let toppingUp=false;
// Open-ended games: quietly fetch more questions before we run out.
async function maybeTopUp(r){
  if(toppingUp) return;
  if(!r||r.src!=='ai'||!r.openEnded||!r.aiQ) return;
  if(r.qIndex < r.aiQ.length-10) return;      // still plenty in hand
  toppingUp=true;
  try{
    const more=await generateAI(r.topic,r.cats,30);
    if(more.length){
      const have=new Set(r.aiQ.map(x=>x.q.toLowerCase()));
      const fresh=more.filter(x=>!have.has(x.q.toLowerCase()));
      if(fresh.length) await db.ref('rooms/'+ME.code+'/aiQ').set(r.aiQ.concat(fresh));
    }
  }catch(e){ console.error('top-up failed',e); }
  toppingUp=false;
}

async function onlineNext(r){
  const nextI=r.qIndex+1;
  if(nextI>=deckLen(r)){
    if(r.openEnded && r.src==='ai'){ await maybeTopUp(r); }   // wait for more
    if(nextI>=deckLen(lastRoom||r)){ await db.ref('rooms/'+ME.code).update({finished:true}); return; }
  }
  await db.ref('rooms/'+ME.code).update({
    qIndex:nextI, phase:'countdown', phaseAt:firebase.database.ServerValue.TIMESTAMP,
    options:null, answers:null, showAnswer:false, revealed:false,
    dbl: !!(r.dblSet&&r.dblSet[nextI])
  });
}


/* ============ SYNC ============ */
function subscribeRoom(code){
  unsubscribeRoom();
  roomRef=db.ref('rooms/'+code);
  roomListener=roomRef.on('value',snap=>{
    const r=snap.val();
    if(!r){ if(ME.role==='player'){toast('Room closed by host');goHome();} return; }
    const prev=lastRoom;
    // New question (or phase leaving 'question') clears my tap-lock so I can answer the next one.
    if(prev && (prev.qIndex!==r.qIndex || (prev.phase==='question'&&r.phase!=='question'))){
      myLockedSig=null; optimisticPick=null;
      const ln=document.getElementById('lockedNote'); if(ln) ln.remove();
    }
    lastRoom=r;
    if(ME.role==='player') playerTransitionSounds(prev,r);
    if(r.online && r.started && !r.finished){startEngine();startUITick();} else if(!r.online){stopEngine();stopUITick();}
    const st=timerStart(r);
    if(r.started&&r.timeLimit&&st){
      if(!prev||timerStart(prev)!==st){lastBeepSecond=null;playedTimeUp=false;}
      startTicking();
    } else stopTicking();
    if(r.online) renderOnline(r);
    else if(ME.role==='mod') renderMod(r); else renderPlayer(r);
  });
}
function unsubscribeRoom(){if(roomRef&&roomListener)roomRef.off('value',roomListener);roomRef=null;roomListener=null;}

function playerTransitionSounds(prev,r){
  if(!prev) return;
  // double-points round announced
  if(!prev.dbl && r.dbl) sDouble();
  if(r.online){
    if(prev.phase!=='question' && r.phase==='question') sGo();
    if(prev.phase!=='reveal' && r.phase==='reveal'){
      const my=answersObj(r)[ME.id], q=currentQ(r);
      if(my && my.choice===q.a) sCorrect(); else sWrong();
    }
    return;
  }
  if(r.mode!=='fff'){
    if(!prev.result && r.result){ r.result.correct?sCorrect():sWrong(); }
  } else {
    if(!prev.showAnswer && r.showAnswer){
      const my=answersObj(r)[ME.id];
      const q=currentQ(r);
      if(my && my.choice===q.a) sCorrect(); else sWrong();
    }
  }
}

// Ask the Netlify function for questions.
// Netlify functions time out around 10s, so we request small batches in parallel
// and retry once. Partial success is still success.
async function callGen(topic,cats,n,avoid){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),26000);
  try{
    const res=await fetch('/api/questions',{
      method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({topic:topic||'',categories:cats,count:n,avoid:avoid||[]})
    });
    clearTimeout(t);
    const txt=await res.text();
    let data={}; try{ data=JSON.parse(txt); }catch(_){
      if(res.status===404) aiError='not-deployed'; else aiError='bad-response';
      console.error('AI raw:',txt.slice(0,300)); return [];
    }
    if(!res.ok){ aiError=data.error||('HTTP '+res.status); console.error('AI error',data); return []; }
    return Array.isArray(data.questions)?data.questions:[];
  }catch(e){
    clearTimeout(t);
    aiError=(e.name==='AbortError')?'timeout':e.message;
    console.error('AI call failed',e); return [];
  }
}
// Ask for the FULL count in one call. If short, do up to 2 top-up calls that
// explicitly avoid the questions we already have (kills the repeats + shortfall).
async function generateAI(topic,cats,count){
  aiError=null;
  const want=count>0?count:20;
  const have=[]; const seen=new Set();
  const absorb=list=>list.forEach(q=>{
    if(!q||!q.q||!q.a) return;
    const k=q.q.trim().toLowerCase();
    if(seen.has(k)) return;
    seen.add(k); have.push(q);
  });
  absorb(await callGen(topic,cats,want,[]));
  for(let round=0; have.length<want && round<2; round++){
    const need=want-have.length;
    const avoid=have.map(q=>q.q);
    const more=await callGen(topic,cats,need,avoid);
    if(!more.length) break;
    absorb(more);
  }
  return have.slice(0,want);
}

async function createRoom(forceBank){
  unlockAudio();
  let code=newCode();
  for(let i=0;i<4;i++){const s=await db.ref('rooms/'+code).get();if(!s.exists())break;code=newCode();}
  // AI is the primary source; the verified bank is the fallback
  const openEnded = setupSel.count===0;
  let aiQ=null, usedSrc='bank';
  if(!forceBank){
    const n = openEnded ? 50 : setupSel.count;   // preload the whole game up front
    screenGenerating(setupSel.topic
      ? ('Writing '+n+' questions about '+setupSel.topic+'…')
      : ('Writing '+n+' questions…'));
    const gen=await generateAI(setupSel.topic,setupSel.cats,n);
    if(gen.length>=5){
      aiQ=gen; usedSrc='ai';
      // Guarantee the requested count for fixed-length games: pad any shortfall
      // with matching bank questions so 20 always means 20.
      if(!openEnded && aiQ.length<n){
        const cats = setupSel.cats.length?setupSel.cats:CATEGORIES;
        const extra=buildDeck(cats, n-aiQ.length).map(i=>({
          q:ALL[i].q, a:ALL[i].a, cat:ALL[i].c, opts:optionsFor(i)
        }));
        aiQ=aiQ.concat(extra).slice(0,n);
      }
    } else {
      screenAIFailed(aiError,setupSel.topic,()=>createRoom(false),()=>createRoom(true));
      return;
    }
  }
  if(usedSrc==='bank' && !setupSel.cats.length){ setupSel.cats=[...CATEGORIES]; }
  const deck=buildDeck(setupSel.cats,setupSel.count);
  // In online mode a timer is required so rounds can auto-advance
  let tl=Math.min(30,Math.max(0,setupSel.time));
  if(setupSel.online && tl<5) tl=15;
  // pre-pick which questions are double-point rounds (online mode)
  const effLen = aiQ ? aiQ.length : deck.length;
  const dblSet={};
  if(setupSel.dbl && setupSel.online){
    for(let i=0;i<effLen;i++){ if(Math.random()<0.2) dblSet[i]=true; }
  }
  const myId=setupSel.online?uid():'mod';
  const room={
    code,created:firebase.database.ServerValue.TIMESTAMP,
    hostName:setupSel.name, mode:setupSel.mode,
    online:!!setupSel.online, suspense:!!setupSel.suspense,
    dblEnabled:!!setupSel.dbl, dblSet, dbl:false, neg:setupSel.neg||0,
    engineId:setupSel.online?myId:null,
    phase:'countdown', phaseAt:null, seq:0,
    cats:setupSel.cats, timeLimit:tl,
    src:usedSrc, topic:setupSel.topic||null, aiQ:aiQ||null, openEnded,
    started:false,finished:false,qIndex:0,
    revealed:false,revealedAt:null,
    buzzedBy:null,buzzedAt:null,result:null,
    answers:null,showAnswer:false,options:null,
    players:{},scores:{},deck
  };
  if(setupSel.online){ room.players[myId]=setupSel.name; room.scores[myId]=0; }
  await db.ref('rooms/'+code).set(room);
  ME=setupSel.online
    ? {role:'player',name:setupSel.name,code,id:myId}
    : {role:'mod',name:setupSel.name,code,id:'mod'};
  subscribeRoom(code);
}

async function joinGame(){
  unlockAudio();
  const name=(document.getElementById('pname').value||'').trim();
  const code=(document.getElementById('pcode').value||'').trim();
  if(!name){toast('Enter your name');return;}
  if(code.length!==4){toast('Enter the 4-digit code');return;}
  const snap=await db.ref('rooms/'+code).get();
  if(!snap.exists()){toast('Room not found');return;}
  const existing=Object.values(snap.val().players||{});
  if(existing.some(n=>String(n).trim().toLowerCase()===name.toLowerCase())){
    toast('"'+name+'" is already taken — pick another name');
    return;
  }
  const id=uid();
  const up={};
  up['rooms/'+code+'/players/'+id]=name;
  up['rooms/'+code+'/scores/'+id]=0;
  await db.ref().update(up);
  ME={role:'player',name,code,id};
  subscribeRoom(code);
}

/* ---------- RESULTS ---------- */
function renderResults(r){
  stopTicking();
  const players=Object.entries(playersObj(r));
  const sc=scoresObj(r);
  const ranked=players.map(([id,nm])=>({id,nm,pts:sc[id]||0})).sort((a,b)=>b.pts-a.pts);
  let place=0,prev=null;
  ranked.forEach((x,i)=>{if(x.pts!==prev){place=i+1;prev=x.pts;}x.place=place;});
  const medal=p=>p===1?'🥇':p===2?'🥈':p===3?'🥉':'#'+p;
  const w=ranked[0];
  app.innerHTML=`
    <div class="rank-hero">
      <div class="trophy">🏆</div>
      <h1>Final Rankings</h1>
      <div class="sub">${w?esc(w.nm)+' wins!':'Game over'}</div>
    </div>
    <div style="margin-top:14px">
      ${ranked.length?ranked.map(x=>{
        const me=(ME.role==='player'&&x.id===ME.id);
        const cls=x.place===1?'rank-1':x.place===2?'rank-2':x.place===3?'rank-3':'';
        return `<div class="rank-row ${cls}"><div class="rank-pos">${medal(x.place)}</div>
          <div class="rank-name">${esc(x.nm)}${me?'<span class="you-badge">YOU</span>':''}</div>

      }).join(''):'<div class="mini">No players.</div>'}
    </div>
    <div style="margin-top:auto">
      ${(ME.role==='mod'||(r.online&&ME.id===r.engineId))?`
        <button class="btn btn-gold" id="again">▶ Play Again (same players)</button>`:''}
      <button class="btn btn-ghost" id="home">🏠 Back to Start</button>
      ${ME.role==='mod'?`<button class="btn btn-ghost btn-sm" id="close" style="width:100%;margin-top:8px">Close room</button>`:''}
    </div>
  `;
  document.getElementById('home').onclick=goHome;
  const againBtn=document.getElementById('again');
  if(againBtn){
    againBtn.onclick=async()=>{
      const reset={};Object.keys(playersObj(r)).forEach(id=>reset[id]=0);
      await db.ref('rooms/'+ME.code).update({
        finished:false,started:false,qIndex:0,revealed:false,revealedAt:null,
        buzzedBy:null,buzzedAt:null,result:null,answers:null,showAnswer:false,
        phase:'countdown',phaseAt:null,seq:0,options:null,
        scores:reset,deck:(r.src==='ai'?r.deck:buildDeck((r.cats&&r.cats.length)?r.cats:CATEGORIES, deckLen(r)))
      });
    };
  }
  const closeBtn=document.getElementById('close');
  if(closeBtn) closeBtn.onclick=async()=>{
    if(confirm('Close the room for everyone?')){await db.ref('rooms/'+ME.code).remove();goHome();}
  };
}

function myScoreDisplay(r){

function renderOnline(r){
  if(r.finished){renderResults(r);return;}
  const isEngine=ME.id===r.engineId;
  const players=Object.entries(playersObj(r));
  // LOBBY
  if(!r.started){
    app.innerHTML=`
      <div class="modbar">

        <div class="center"><div class="pill-live"><span class="dot"></span>OPEN</div></div>
      </div>
      <div class="qbox center">
        <div class="ans-label">Room code — share this</div>
        <div style="font-size:46px;font-weight:900;letter-spacing:6px;color:var(--cerise);margin:6px 0">${r.code}</div>
        <div class="mini" style="margin:0">${deckLen(r)} questions · ${r.timeLimit}s each${r.suspense?' · 🙈 suspense':''}${r.dblEnabled?' · ✖️2 rounds':''}</div>
        <div class="mini" style="margin-top:4px"><span class="srcbadge">${r.src==='ai'?'🤖 AI'+(r.topic?' · '+esc(r.topic):''):'📚 Question bank'}</span></div>
        <div class="mini" style="margin-top:4px">No host needed — questions play automatically.</div>
      </div>
      <div class="scores">
        <div class="ans-label" style="margin-bottom:8px">Players (${players.length})</div>
        ${players.map(([id,nm])=>`<div class="srow"><span>👤 ${esc(nm)}${id===ME.id?'<span class="you-badge">YOU</span>':''}</span></div>`).join('')}
      </div>
      <div style="margin-top:auto">
        ${isEngine?`<button class="btn btn-gold" id="start">▶ Start Quiz</button>
          <p class="hint" style="text-align:center">Keep this tab open — your device runs the game clock.</p>`
         :`<div class="mini">Waiting for ${esc(r.hostName||'the organiser')} to start…</div>`}
      </div>
      <div class="center"><button class="backlink" id="leave">Leave</button></div>`;
    if(isEngine) document.getElementById('start').onclick=async()=>{
      await db.ref('rooms/'+ME.code).update({
        started:true,phase:'countdown',phaseAt:firebase.database.ServerValue.TIMESTAMP,
        qIndex:0,dbl:!!(r.dblSet&&r.dblSet[0])
      });
    };
    document.getElementById('leave').onclick=goHome;
    return;
  }
  const q=currentQ(r);
  const head=`<div class="modbar">
    <div><div class="sub" style="margin:0">${esc(ME.name)}</div><div style="font-weight:900;font-size:15px">Room #${r.code}</div></div>
    <div class="center"><div class="ans-label">Score</div><div style="font-size:25px;font-weight:900;color:var(--violet)">${myScoreDisplay(r)}</div></div>
  </div>`;
  // COUNTDOWN
  if(r.phase==='countdown'){
    const left=Math.max(0,Math.ceil(COUNTDOWN_S-((serverNow()-(r.phaseAt||0))/1000)));
    app.innerHTML=`${head}
      ${dblBanner(r)}
      <div class="getready" style="margin-top:auto;margin-bottom:auto">
        <div class="big" style="font-size:64px">${left>0?left:'GO!'}</div>
        <div class="qtext" style="margin-top:10px">Question ${r.qIndex+1} of ${deckLen(r)}</div>
        <div class="mini" style="margin-top:8px"><span class="cat-chip" style="background:${catColor(q.c)}">${esc(q.c)}</span></div>
      </div>
      <div class="center"><button class="backlink" id="leave">Leave</button></div>`;
    document.getElementById('leave').onclick=goHome;
    return;
  }
  const opts=r.options||[];
  const ans=answersObj(r);
  const my=ans[ME.id];
  // REVEAL
  if(r.phase==='reveal'||r.showAnswer){
    const ok=my&&my.choice===q.a;
    const correct=Object.entries(ans).filter(([id,a])=>a.choice===q.a).sort((a,b)=>a[1].at-b[1].at);
    const myRank=correct.findIndex(([id])=>id===ME.id);
    const pts=ok?pointsFor(r,myRank):0;
    const winnerId=correct.length?correct[0][0]:null;
    app.innerHTML=`${head}
      <div class="result-banner ${ok&&pts>0?'result-correct':'result-wrong'}" style="margin-top:14px">
        <div class="result-emoji">${ok?(pts>0?'✅':'😬'):'❌'}</div>
        <div class="result-text">${ok?(pts>0?'Correct!':'Correct, but too slow'):(my?'Wrong':'No answer')}</div>
        <div class="result-sub">${ok&&pts>0
            ? (r.mode==='buzzer'?'🏆 First! ':(myRank===0?'⚡ Fastest! ':'#'+(myRank+1)+' fastest '))+(r.suspense?'':'+'+pts+' points')
            : 'Answer: '+esc(q.a)}</div>
      </div>
      ${r.mode==='buzzer'&&winnerId?`<div class="answered">🏆 ${esc(playersObj(r)[winnerId])} got there first</div>`:''}
      <div class="opts">
        ${opts.map((o,i)=>{
          const isC=o===q.a, mineWrong=my&&my.choice===o&&!isC;
          return `<button class="optbtn ${isC?'correct':''} ${mineWrong?'wrongpick':''}" disabled>
            <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
        }).join('')}
      </div>
      <div class="mini" style="margin-top:14px">Next question in a moment…</div>
      <div class="center"><button class="backlink" id="leave">Leave</button></div>`;
    document.getElementById('leave').onclick=goHome;
    return;
  }
  // QUESTION
  const sig='O'+r.qIndex+r.code;
  const needType=typedSig!==sig;
  const qHead=`${head}
    ${dblBanner(r)}
    <div class="qbox">
      <span class="cat-chip" style="background:${catColor(q.c)}">${esc(q.c)}</span>
      <div class="qnum" style="margin-top:12px">Q ${r.qIndex+1} of ${deckLen(r)}</div>
      <div class="qtext" id="qtext"></div>
    </div>`;

  /* ---- ONLINE BUZZER: buzz first, then only that player answers ---- */
  if(r.mode==='buzzer'){
    const buzzed=!!r.buzzedBy, mine=r.buzzedBy===ME.id;
    const bName=buzzed?playersObj(r)[r.buzzedBy]:'';
    if(buzzed && mine && !my){
      // I won the buzz — I get to pick
      app.innerHTML=`${qHead}
        <div id="timerHolder">${buzzTimerHTML(r)}</div>
        <div class="status">🎉 You buzzed first — pick your answer!</div>
        <div class="opts">
          ${opts.map((o,i)=>`<button class="optbtn" data-o="${esc(o)}">
            <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
        </div>
        <div class="center"><button class="backlink" id="leave">Leave</button></div>`;
      const el0=document.getElementById('qtext');
      if(needType){typedSig=sig;typeText(el0,q.q);}else{el0.textContent=q.q;}
      document.querySelectorAll('.optbtn').forEach(b=>bindTap(b,()=>pickAnswer(b.dataset.o)));
      document.getElementById('leave').onclick=goHome;
      return;
    }
    // Not the buzzer (or already answered): show the buzzer / a lock
    let cls='bz',lab='BUZZ';
    if(buzzed&&mine){cls='bz mine';lab='YOU!';}
    else if(buzzed){cls='bz locked';lab='🔒';}
    const ready=typingDone;                     // buzzer only opens once the question is fully shown
    app.innerHTML=`${qHead}
      <div id="timerHolder">${buzzed?buzzTimerHTML(r):timerHTML(r)}</div>
      <div class="status">${
        buzzed
          ? (mine?'✅ Locked in: '+esc(my?my.choice:'')  : '🔒 '+esc(bName)+' buzzed first')
          : (ready?'Hit the buzzer to answer!':'Reading the question…')}</div>
      <div class="buzzer"><button class="${cls}" id="bz" ${(buzzed||!ready)?'disabled':''}>${ready||buzzed?lab:'…'}</button></div>
      <div class="center"><button class="backlink" id="leave">Leave</button></div>`;
    const el1=document.getElementById('qtext');
    if(needType){typedSig=sig;typeText(el1,q.q,()=>renderOnline(lastRoom));}else{el1.textContent=q.q;}
    const bzEl=document.getElementById('bz');
    if(bzEl&&!buzzed&&ready) bindTap(bzEl,onlineBuzz);
    document.getElementById('leave').onclick=goHome;
    return;
  }

  /* ---- ONLINE FASTEST FINGERING FIRST ---- */
  app.innerHTML=`${qHead}
    <div id="timerHolder">${timerHTML(r)}</div>
    ${my?`<div class="answered">✅ Locked in: <b>${esc(my.choice)}</b><div class="mini" style="margin-top:4px">Waiting for the others…</div></div>`:''}
    <div class="opts">
      ${opts.map((o,i)=>`<button class="optbtn ${my&&my.choice===o?'picked':''}" data-o="${esc(o)}" ${my?'disabled':''}>
        <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div class="center"><button class="backlink" id="leave">Leave</button></div>`;
  const el=document.getElementById('qtext');
  if(needType){typedSig=sig;typeText(el,q.q);}else{el.textContent=q.q;}
  if(!my) document.querySelectorAll('.optbtn').forEach(b=>bindTap(b,()=>pickAnswer(b.dataset.o)));
  document.getElementById('leave').onclick=goHome;
}

// countdown for the buzzed player's exclusive answer window
function buzzTimerHTML(r){
  if(!r.buzzedAt) return '';
  const rem=Math.max(0,BUZZ_ANSWER_S-((serverNow()-r.buzzedAt)/1000));
  const pct=Math.max(0,Math.min(100,(rem/BUZZ_ANSWER_S)*100));
  const warn=rem<=3;
  if(rem<=0) return `<div class="timer"><div class="timeup">⏰ Time's up!</div></div>`;
  return `<div class="timer">
    <div class="timer-label">Answer now</div>
    <div class="timer-num ${warn?'warn':''}">${Math.ceil(rem)}s</div>
    <div class="timer-bar"><div class="timer-fill ${warn?'warn':''}" style="width:${pct}%"></div></div>
  </div>`;
}

async function onlineBuzz(){
  unlockAudio(); sBuzz();
  if(navigator.vibrate) navigator.vibrate(60);
  try{
    const res=await db.ref('rooms/'+ME.code+'/buzzedBy').transaction(cur=>{
      if(cur===null||cur===undefined) return ME.id;
      return;
    });
    if(res.committed && res.snapshot.val()===ME.id){
      await db.ref('rooms/'+ME.code+'/buzzedAt').set(firebase.database.ServerValue.TIMESTAMP);
    }else{
      const nm=playersObj(lastRoom)[res.snapshot.val()]||'Someone';
      toast('Too late — '+nm+' buzzed first');
    }
  }catch(e){ toast('Connection hiccup, try again'); }
}

async function modJudge(correct){
  const r=lastRoom,bid=r.buzzedBy;
  const nm=bid?playersObj(r)[bid]:'';
  const up={};
  const gain=r.dbl?20:10;
  const penalty=(r.neg||0)*(r.dbl?2:1);      // negative marking (doubles on x2 rounds)
  let delta=0;
  if(bid){
    delta = correct ? gain : -penalty;
    if(delta!==0) up['rooms/'+ME.code+'/scores/'+bid]=(scoresObj(r)[bid]||0)+delta;
  }
  up['rooms/'+ME.code+'/result']={name:nm,correct,pts:delta};
  up['rooms/'+ME.code+'/buzzedBy']=null;
  up['rooms/'+ME.code+'/buzzedAt']=null;
  await db.ref().update(up);
}
async function modNav(d){
  const r=lastRoom;
  // past the final question of a fixed-length game -> finish and show rankings
  if(d>0 && r.qIndex+1>=deckLen(r) && !r.openEnded){
    await db.ref('rooms/'+ME.code).update({finished:true,buzzedBy:null,buzzedAt:null});
    return;
  }
  const i=Math.max(0,Math.min(deckLen(r)-1,r.qIndex+d));
  await db.ref('rooms/'+ME.code).update({
    qIndex:i,revealed:false,revealedAt:null,buzzedBy:null,buzzedAt:null,
    result:null,answers:null,showAnswer:false,dbl:false,options:null
  });
}
async function endGame(){
  if(confirm('End the game and show everyone the final rankings?'))
    await db.ref('rooms/'+ME.code).update({finished:true,buzzedBy:null,buzzedAt:null});
}

/* ---------- MODERATOR: FASTEST FINGER ---------- */
const FFF_POINTS=[10,8,6,5,4];
function fffPointsFor(rank){return rank<FFF_POINTS.length?FFF_POINTS[rank]:3;}

function renderModFFF(r){
  const players=Object.entries(playersObj(r));
  const q=currentQ(r);
  const ans=answersObj(r);
  const answeredCount=Object.keys(ans).length;
  const opts=r.options||[];
  app.innerHTML=`
    <div class="modbar">
      <div><div class="sub" style="margin:0">Moderator · ⚡ Fastest Fingering First</div><div class="pin">#${r.code}</div></div>
      <div class="center"><div class="pill-live"><span class="dot"></span>LIVE</div><div class="qprog">Q ${r.qIndex+1}/${deckLen(r)}</div></div>
    </div>
    <div class="qbox">
      <span class="cat-chip" style="background:${catColor(q.c)}">${esc(q.c)}</span>
      <div class="qtext" style="margin-top:12px">${esc(q.q)}</div>
      <div class="mini" style="margin-top:8px;text-align:left">${r.revealed?'👁️ Shown to players':'🙈 Hidden — read it aloud, then reveal'}</div>
    </div>
    <div class="ans"><div class="ans-label">Correct answer</div><div class="ans-text">${esc(q.a)}</div></div>
    ${!r.revealed&&r.dblEnabled?`<button class="btn ${r.dbl?'btn-teal':'btn-ghost'}" id="dbl" style="width:100%">${r.dbl?'✖️2 DOUBLE POINTS ON — tap to cancel':'✖️2 Make this a double-points round'}</button>`:''}
    ${!r.revealed?`<button class="btn btn-gold" id="reveal" style="width:100%">👁️ Reveal Question &amp; Options</button>`:''}
    ${r.revealed&&r.dbl?`<div class="answered" style="background:var(--gold);border-style:solid">✖️2 Double points this round</div>`:''}
    ${r.revealed&&!r.showAnswer?`
      <div class="buzzed">
        <div class="ans-label">Answers received</div>
        <div class="who">${answeredCount} / ${players.length}</div>
        <div id="timerHolder">${timerHTML(r)}</div>
        <button class="btn btn-teal" id="lock" style="margin-top:14px">🔒 Lock &amp; Show Results</button>
      </div>`:''}
    ${r.showAnswer?`
      <div class="buzzed">
        <div class="ans-label">Results this round</div>
        ${fffResultRows(r)}
        <button class="btn btn-teal" id="nextq" style="margin-top:14px">Next Question ›</button>
      </div>`:''}
    ${modScoreboard(r,players)}
    ${r.showAnswer?'':`<div class="row" style="margin-top:14px">
      <button class="btn btn-ghost btn-sm" id="prev" style="flex:1">‹ Prev</button>
      <button class="btn btn-gold btn-sm" id="next" style="flex:2">Skip ›</button></div>`}
    <button class="btn btn-cerise btn-sm" id="end" style="width:100%;margin-top:10px">🏁 End Game &amp; Show Rankings</button>`;
  const g=id=>document.getElementById(id);
  if(g('dbl'))g('dbl').onclick=()=>db.ref('rooms/'+ME.code).update({dbl:!r.dbl});
  if(g('reveal'))g('reveal').onclick=fffReveal;
  if(g('lock'))g('lock').onclick=fffLock;
  if(g('nextq'))g('nextq').onclick=()=>modNav(1);
  if(g('next'))g('next').onclick=()=>modNav(1);
  if(g('prev'))g('prev').onclick=()=>modNav(-1);
  g('end').onclick=endGame;
}

function fffResultRows(r){
  const q=currentQ(r),ans=answersObj(r),pl=playersObj(r);
  const rows=Object.entries(ans).map(([id,a])=>({id,nm:pl[id]||'?',choice:a.choice,at:a.at,ok:a.choice===q.a}));
  const correct=rows.filter(x=>x.ok).sort((a,b)=>a.at-b.at);
  correct.forEach((x,i)=>{x.rank=i;x.pts=fffPointsFor(i);});
  const wrong=rows.filter(x=>!x.ok);
  const noAns=Object.entries(pl).filter(([id])=>!ans[id]);
  const line=(x,extra)=>`<div class="srow" style="margin-bottom:6px"><span>${esc(x.nm)}${extra||''}</span><span class="pts">${x.pts!=null?'+'+x.pts:'0'}</span></div>`;
  return `${correct.map((x,i)=>line(x,` <span class="speed-tag">${i===0?'⚡ fastest':'#'+(i+1)}</span>`)).join('')}
    ${wrong.map(x=>line({nm:x.nm,pts:0},' ❌')).join('')}
    ${noAns.map(([id,nm])=>line({nm,pts:0},' — no answer')).join('')}`;
}

async function fffReveal(){
  const r=lastRoom;
  const opts=optionsForRoom(r);
  await db.ref('rooms/'+ME.code).update({
    revealed:true,revealedAt:firebase.database.ServerValue.TIMESTAMP,
    options:opts,answers:null,showAnswer:false
  });
}
async function fffLock(){
  const r=lastRoom,q=currentQ(r),ans=answersObj(r);
  const correct=Object.entries(ans).filter(([id,a])=>a.choice===q.a).sort((a,b)=>a[1].at-b[1].at);
  const up={};
  correct.forEach(([id],i)=>{
    const pts=fffPointsFor(i)*(r.dbl?2:1);
    up['rooms/'+ME.code+'/scores/'+id]=(scoresObj(r)[id]||0)+pts;
  });
  up['rooms/'+ME.code+'/showAnswer']=true;
  await db.ref().update(up);
}

/* ---------- PLAYER ---------- */
let typedSig=null,typeTimer=null;
let typingDone=true;
function typeText(el,text,onDone){
  if(!el)return;
  if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
  typingDone=false;
  el.textContent='';
  const cur=document.createElement('span');cur.className='typecursor';el.appendChild(cur);
  let i=0;
  typeTimer=setInterval(()=>{
    if(i>=text.length){
      clearInterval(typeTimer);typeTimer=null;
      if(cur.parentNode)cur.remove();
      typingDone=true;
      if(typeof onDone==='function') onDone();
      return;
    }
    cur.insertAdjacentText('beforebegin',text[i]);i++;
  },16);
}
function playerHeader(r,myScore){
  const shown=r.suspense?'🙈':myScore;
  return `<div class="modbar">
    <div><div class="sub" style="margin:0">${esc(ME.name)}</div><div style="font-weight:900;font-size:15px">Room #${r.code}</div></div>
    <div class="center"><div class="ans-label">${r.suspense?'Hidden':'Score'}</div><div style="font-size:25px;font-weight:900;color:var(--violet)">${shown}</div></div>
  </div>`;
}

function renderPlayer(r){
  if(r.finished){renderResults(r);return;}
  const myScore=scoresObj(r)[ME.id]||0;
  if(!r.started){
    const n=Object.keys(playersObj(r)).length;
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="qbox center" style="margin-top:auto;margin-bottom:auto">
        <div style="font-size:38px">⏳</div>
        <div class="qtext" style="margin-top:10px">You're in!</div>
        <div class="mini" style="margin-top:8px">Waiting for <b>${esc(r.hostName||'the host')}</b> to start…</div>
        <div class="mini" style="margin-top:4px">${n} player${n===1?'':'s'} · ${r.mode==='fff'?'⚡ Fastest Fingering First':'🔔 Buzzer'} mode</div>
      </div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;
    typedSig=null;typingDone=false;return;
  }
  if(r.mode==='fff') return renderPlayerFFF(r,myScore);
  return renderPlayerBuzzer(r,myScore);
}

function renderPlayerBuzzer(r,myScore){
  const q=currentQ(r);
  if(r.result){
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="result-banner ${r.result.correct?'result-correct':'result-wrong'}" style="margin-top:auto">
        <div class="result-emoji">${r.result.correct?'✅':'❌'}</div>
        <div class="result-text">${r.result.correct?'Correct!':'Wrong'}</div>
        <div class="result-sub">${esc(r.result.name)}${r.result.correct?(r.suspense?' got it right':' scored +'+(r.result.pts||10)):(r.suspense?' got it wrong':(r.result.pts<0?' '+r.result.pts+' points':' — no points'))}</div>
      </div>
      <div class="mini" style="margin-top:16px;margin-bottom:auto">Waiting for the next question…</div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;return;
  }
  if(!r.revealed){
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="getready" style="margin-top:auto;margin-bottom:auto">
        <div class="big">👂</div>
        <div class="qtext" style="margin-top:10px">Get ready…</div>
        <div class="mini" style="margin-top:8px">Question ${r.qIndex+1} of ${deckLen(r)}</div>
        <div class="mini" style="margin-top:4px">${esc(r.hostName||'The host')} is reading the question.</div>
      </div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;typedSig=null;return;
  }
  const buzzed=!!r.buzzedBy,mine=r.buzzedBy===ME.id;
  const bName=buzzed?playersObj(r)[r.buzzedBy]:'';
  let cls='bz',lab='BUZZ';
  if(buzzed&&mine){cls='bz mine';lab='YOU!';}
  else if(buzzed){cls='bz locked';lab='🔒';}
  const sig='B'+r.qIndex+r.code;
  const needType=typedSig!==sig;
  app.innerHTML=`${playerHeader(r,myScore)}
    <div class="qbox">
      <span class="cat-chip" style="background:${catColor(q.c)}">${esc(q.c)}</span>
      <div class="qnum" style="margin-top:12px">Q ${r.qIndex+1} of ${deckLen(r)} · Host: ${esc(r.hostName||'Moderator')}</div>
      <div class="qtext" id="qtext"></div>
    </div>
    <div id="timerHolder">${buzzed?timerHTML(r):''}</div>
    <div class="status">${mine?'🎉 You buzzed first! Answer now.':buzzed?'🔒 '+esc(bName)+' buzzed first':'Hit the buzzer!'}</div>
    <div class="buzzer"><button class="${cls}" id="bz" ${buzzed?'disabled':''}>${lab}</button></div>
    <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
  const el=document.getElementById('qtext');
  if(needType){typedSig=sig;typeText(el,q.q);}else{el.textContent=q.q;}
  const b=document.getElementById('bz');
  if(b&&!buzzed)b.onclick=playerBuzz;
  document.getElementById('leave').onclick=goHome;
}

async function playerBuzz(){
  unlockAudio();sBuzz();
  if(navigator.vibrate)navigator.vibrate(60);
  const ref=db.ref('rooms/'+ME.code);
  try{
    const res=await ref.child('buzzedBy').transaction(cur=>{
      if(cur===null||cur===undefined) return ME.id;
      return;
    });
    if(res.committed&&res.snapshot.val()===ME.id){
      await ref.child('buzzedAt').set(firebase.database.ServerValue.TIMESTAMP);
    }else{
      const nm=playersObj(lastRoom)[res.snapshot.val()]||'Someone';
      toast('Too late — '+nm+' got it');
    }
  }catch(e){toast('Connection hiccup, try again');}
}

function renderPlayerFFF(r,myScore){
  const q=currentQ(r);
  const opts=r.options||[];
  const ans=answersObj(r);
  const my=ans[ME.id];
  // results shown
  if(r.showAnswer){
    const ok=my&&my.choice===q.a;
    const correctSorted=Object.entries(ans).filter(([id,a])=>a.choice===q.a).sort((a,b)=>a[1].at-b[1].at);
    const myRank=correctSorted.findIndex(([id])=>id===ME.id);
    const pts=ok?fffPointsFor(myRank)*(r.dbl?2:1):0;
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="result-banner ${ok?'result-correct':'result-wrong'}" style="margin-top:14px">
        <div class="result-emoji">${ok?'✅':'❌'}</div>
        <div class="result-text">${ok?'Correct!':(my?'Wrong':'No answer')}</div>
        <div class="result-sub">${ok?(myRank===0?'⚡ Fastest! ':'#'+(myRank+1)+' fastest ')+(r.suspense?'':'+'+pts+' points'):'The answer was: '+esc(q.a)}</div>
      </div>
      <div class="opts">
        ${opts.map((o,i)=>{
          const isC=o===q.a, mineWrong=my&&my.choice===o&&!isC;
          return `<button class="optbtn ${isC?'correct':''} ${mineWrong?'wrongpick':''}" disabled>
            <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
        }).join('')}

      <div class="mini" style="margin-top:14px">Waiting for the next question…</div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;return;
  }
  // not revealed
  if(!r.revealed){
    app.innerHTML=`${playerHeader(r,myScore)}
      <div class="getready" style="margin-top:auto;margin-bottom:auto">
        <div class="big">👂</div>
        <div class="qtext" style="margin-top:10px">Get ready…</div>
        <div class="mini" style="margin-top:8px">Question ${r.qIndex+1} of ${deckLen(r)}</div>
        <div class="mini" style="margin-top:4px">${esc(r.hostName||'The host')} is reading the question.</div>
      </div>
      <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
    document.getElementById('leave').onclick=goHome;typedSig=null;return;
  }
  // answering
  const sig='F'+r.qIndex+r.code;
  const needType=typedSig!==sig;
  app.innerHTML=`${playerHeader(r,myScore)}
    <div class="qbox">
      <span class="cat-chip" style="background:${catColor(q.c)}">${esc(q.c)}</span>
      <div class="qnum" style="margin-top:12px">Q ${r.qIndex+1} of ${deckLen(r)} · Host: ${esc(r.hostName||'Moderator')}</div>
      <div class="qtext" id="qtext"></div>
    </div>
    <div id="timerHolder">${timerHTML(r)}</div>
    ${my?`<div class="answered">✅ Locked in: <b>${esc(my.choice)}</b><div class="mini" style="margin-top:4px">Waiting for others…</div></div>`:''}
    <div class="opts">
      ${opts.map((o,i)=>`<button class="optbtn ${my&&my.choice===o?'picked':''}" data-o="${esc(o)}" ${my?'disabled':''}>
        <span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div class="center"><button class="backlink" id="leave">Leave room</button></div>`;
  const el=document.getElementById('qtext');
  if(needType){typedSig=sig;typeText(el,q.q);}else{el.textContent=q.q;}
  if(!my){
    document.querySelectorAll('.optbtn').forEach(b=>bindTap(b,()=>pickAnswer(b.dataset.o)));
  }
  document.getElementById('leave').onclick=goHome;
}

async function joinFromLauncher(roomCode, pName, pId, isHostFlag) {
  ME = {
    role: isHostFlag ? 'mod' : 'player',
    name: pName,
    code: roomCode,
    id: isHostFlag ? 'mod' : (pId || uid())
  };

  const snap = await db.ref('rooms/' + roomCode).get();
  if (!snap.exists() && isHostFlag) {
    const deck = buildDeck(CATEGORIES, 10);
    const room = {
      code: roomCode, created: firebase.database.ServerValue.TIMESTAMP, hostName: pName,
      online: true, engineId: ME.id, phase: 'lobby', timeLimit: 15, src: 'bank', topic: 'General Knowledge',
      started: false, finished: false, qIndex: 0, players: { [ME.id]: pName }, scores: { [ME.id]: 0 }, deck: deck
    };
    await db.ref('rooms/' + roomCode).set(room);
  } else if (snap.exists() && !isHostFlag) {
    const up = {};
    up['rooms/' + roomCode + '/players/' + ME.id] = pName;
    up['rooms/' + roomCode + '/scores/' + ME.id] = 0;
    await db.ref().update(up);
  }

  subscribeRoom(roomCode);
}

function screenHome() {
  const urlParams = new URLSearchParams(window.location.search);
  const autoRoom = urlParams.get('room');
  const autoName = urlParams.get('name');
  const autoPid  = urlParams.get('pid');
  const autoHost = urlParams.get('isHost') === 'true';

  // IF LAUNCHED FROM SUPER-APP: Bypass home UI & join directly
  if (autoRoom && autoName) {
    joinFromLauncher(autoRoom, autoName, autoPid, autoHost);
    return; 
  }

  // Otherwise, render original homepage if opened standalone
  stopTicking();
  app.innerHTML = `
    <div class="home-hero">
      <span class="tag">Online & Local</span>
      <h1>Quiz Night</h1>
      <div class="sub">Party Quiz & Buzzer</div>
    </div>
    <div class="card">
      <label>Your Name</label>
      <input type="text" id="pname" placeholder="Enter name..." maxlength="18" value="${esc(ME.name || '')}">
      <button class="btn btn-gold" id="btn-host">👑 Host a Game</button>
      <button class="btn btn-teal" id="btn-join">👥 Join a Room</button>
    </div>
  `;
}
