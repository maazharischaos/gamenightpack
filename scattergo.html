<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Scattergo · Scattergories</title>

<link rel="manifest" href="manifest.json" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#12172B;
  --ink-2:#1B2140;
  --ink-3:#252C52;
  --cream:#FBF6EC;
  --cream-dim:#EFE7D6;
  --marigold:#F2B705;
  --marigold-deep:#D99B00;
  --coral:#EF5B5B;
  --coral-deep:#D43F3F;
  --mint:#3FBF95;
  --mint-deep:#2A9C77;
  --plum:#8A63D2;
  --plum-deep:#6C4AB6;
  --ink-text:#12172B;
  --muted:#6B7094;
  --line: rgba(18,23,43,0.10);
  --line-lite: rgba(251,246,236,0.14);
  --shadow-soft: 0 10px 30px rgba(18,23,43,0.35);
  --shadow-card: 0 2px 10px rgba(18,23,43,0.08);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --font-display: 'Fredoka', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, sans-serif;
  --font-mono: 'Space Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background: radial-gradient(1200px 800px at 50% -10%, #232a52 0%, var(--ink) 55%, #0d1122 100%);
  color:var(--cream);
  min-height:100vh;
  overscroll-behavior-y: contain;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
}
::selection{background:var(--marigold); color:var(--ink);}
a{color:inherit;}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:rgba(251,246,236,0.2); border-radius:4px;}

/* ============ UTILITY ============ */
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  padding: max(20px, env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  animation: fadeUp .38s cubic-bezier(.2,.8,.2,1);
}
@keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--marigold);
  font-weight:700;
  margin:0 0 6px;
}
h1.title{
  font-family:var(--font-display);
  font-size:30px;
  font-weight:600;
  line-height:1.15;
  margin:0 0 4px;
  color:var(--cream);
}
p.sub{
  color:rgba(251,246,236,0.62);
  font-size:14.5px;
  line-height:1.5;
  margin:0 0 20px;
}
.spacer{flex:1;}
.stack{display:flex; flex-direction:column; gap:12px;}
.row{display:flex; gap:10px;}
.center{display:flex; align-items:center; justify-content:center;}

/* ============ LOGO / HOME ============ */
.logo-wrap{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: 30px 0 10px;
}
.logo-tile{
  width:104px; height:104px; border-radius:26px;
  background: linear-gradient(155deg, var(--marigold) 0%, var(--marigold-deep) 100%);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:56px; color:var(--ink);
  box-shadow: 0 14px 34px rgba(242,183,5,0.35), inset 0 -6px 0 rgba(0,0,0,0.12);
  transform: rotate(-4deg);
  margin-bottom:18px;
  position:relative;
}
.logo-tile::after{
  content:"";
  position:absolute; inset:6px;
  border:2px dashed rgba(18,23,43,0.18);
  border-radius:18px;
}
.logo-word{font-family:var(--font-display); font-size:34px; font-weight:600; letter-spacing:-.01em;}
.logo-word .accent{color:var(--marigold);}
.logo-tagline{color:rgba(251,246,236,0.55); font-size:13.5px; margin-top:4px; font-family:var(--font-mono); letter-spacing:.04em;}

/* ============ BUTTONS ============ */
.btn{
  appearance:none; border:none; cursor:pointer;
  border-radius: var(--radius-md);
  padding:16px 20px;
  font-size:16px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  width:100%;
  font-family:var(--font-body);
}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.btn-primary{
  background: linear-gradient(155deg, var(--marigold) 0%, var(--marigold-deep) 100%);
  color:var(--ink);
  box-shadow: 0 10px 24px rgba(242,183,5,0.28);
}
.btn-secondary{
  background: var(--ink-3);
  color: var(--cream);
  border:1px solid var(--line-lite);
}
.btn-ghost{
  background: transparent;
  color: var(--cream);
  border:1.5px solid rgba(251,246,236,0.25);
}
.btn-coral{
  background: linear-gradient(155deg, var(--coral) 0%, var(--coral-deep) 100%);
  color:#fff;
  box-shadow: 0 10px 24px rgba(239,91,91,0.28);
}
.btn-mint{
  background: linear-gradient(155deg, var(--mint) 0%, var(--mint-deep) 100%);
  color:#08281d;
  box-shadow: 0 10px 24px rgba(63,191,149,0.28);
}
.btn-sm{ padding:10px 14px; font-size:13.5px; border-radius:12px; width:auto; }
.btn-block-row{display:flex; gap:10px;}
.btn-block-row .btn{flex:1;}

.iconbtn{
  width:40px; height:40px; border-radius:12px; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:18px;
  background:var(--ink-3); color:var(--cream); border:1px solid var(--line-lite);
}

/* ============ CARDS ============ */
.card{
  background: var(--cream);
  color: var(--ink-text);
  border-radius: var(--radius-lg);
  padding:18px;
  box-shadow: var(--shadow-card);
}
.card-dark{
  background: var(--ink-2);
  color: var(--cream);
  border-radius: var(--radius-lg);
  padding:18px;
  border:1px solid var(--line-lite);
}

/* ============ CHIP SELECT GROUPS ============ */
.field-label{
  font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:rgba(251,246,236,0.5); margin: 18px 0 9px;
}
.field-label:first-child{margin-top:0;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:11px 16px; border-radius:12px; cursor:pointer;
  background: var(--ink-3); color:rgba(251,246,236,0.75);
  border:1.5px solid rgba(251,246,236,0.12);
  font-weight:700; font-size:14.5px;
  transition: all .15s ease;
  user-select:none;
}
.chip.active{
  background: var(--marigold); color:var(--ink); border-color:var(--marigold);
  box-shadow: 0 6px 16px rgba(242,183,5,0.3);
}
.chip.wide{flex:1; text-align:center;}
.letter-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
.letter-grid .chip{padding:0; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:18px;}
.text-input{
  width:100%; padding:15px 16px; border-radius:14px;
  border:1.5px solid var(--line-lite);
  background: var(--ink-3); color:var(--cream);
  font-size:16px; font-weight:600; outline:none;
}
.text-input::placeholder{color:rgba(251,246,236,0.35); font-weight:500;}
.text-input:focus{border-color:var(--marigold);}
.text-input.light{ background:#fff; color:var(--ink-text); border:1.5px solid var(--line); }
.text-input.light::placeholder{color:#A6A9BE;}
.text-input.light:focus{border-color:var(--marigold-deep);}

/* ============ HEADER BAR ============ */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}
.roompill{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.08em;
  background:var(--ink-3); border:1px solid var(--line-lite);
  padding:7px 12px; border-radius:100px; color:rgba(251,246,236,0.7);
}
.roompill b{color:var(--marigold);}

/* ============ LOBBY ============ */
.code-display{
  text-align:center; padding:26px 0 10px;
}
.code-display .code{
  font-family:var(--font-display); font-weight:700;
  font-size:56px; letter-spacing:.12em; color:var(--marigold);
  text-shadow: 0 4px 20px rgba(242,183,5,0.35);
}
.code-hint{color:rgba(251,246,236,0.5); font-size:13px; margin-top:6px;}
.player-list{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.player-row{
  display:flex; align-items:center; gap:10px;
  background:var(--ink-3); border:1px solid var(--line-lite);
  padding:12px 14px; border-radius:14px;
}
.avatar{
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-family:var(--font-display); font-size:15px; color:var(--ink);
}
.player-name{font-weight:700; font-size:14.5px; flex:1;}
.player-score{font-family:var(--font-mono); font-weight:700; color:var(--marigold); font-size:13.5px;}
.empty-note{
  text-align:center; color:rgba(251,246,236,0.4); font-size:13.5px;
  padding:22px 10px; border:1.5px dashed rgba(251,246,236,0.18); border-radius:14px;
}

/* ============ LETTER TILE (signature) ============ */
.letter-stage{
  display:flex; flex-direction:column; align-items:center; padding:6px 0 18px;
  perspective: 800px;
}
.letter-tile{
  width:92px; height:92px; border-radius:22px;
  background: linear-gradient(155deg, var(--cream) 0%, var(--cream-dim) 100%);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:48px; color:var(--ink);
  box-shadow: 0 16px 30px rgba(0,0,0,0.35), inset 0 -5px 0 rgba(0,0,0,0.08);
  position:relative;
  animation: tileFlip .6s cubic-bezier(.2,.8,.2,1);
}
@keyframes tileFlip{
  0%{ transform: rotateY(90deg) scale(.8); opacity:0; }
  60%{ transform: rotateY(-8deg) scale(1.03); opacity:1;}
  100%{ transform: rotateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce){ .letter-tile{animation:none;} }
.letter-tile .dot{
  position:absolute; width:6px; height:6px; border-radius:50%; background: rgba(18,23,43,0.15);
}
.letter-tile .dot.tl{top:9px; left:9px;} .letter-tile .dot.br{bottom:9px; right:9px;}
.letter-caption{
  margin-top:10px; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em;
  color:rgba(251,246,236,0.5); text-transform:uppercase;
}

/* ============ TIMER ============ */
.timer-bar{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:6px;
}
.timer-display{
  font-family:var(--font-mono); font-weight:700; font-size:26px;
  background: var(--ink-3); border:1px solid var(--line-lite);
  padding:8px 18px; border-radius:100px; letter-spacing:.03em;
  transition: color .2s ease, border-color .2s ease;
}
.timer-display.urgent{ color:var(--coral); border-color:rgba(239,91,91,0.5); animation: pulseUrgent 1s infinite; }
@keyframes pulseUrgent{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
.timer-track{
  height:6px; border-radius:6px; background:var(--ink-3); overflow:hidden; margin: 4px 0 18px;
}
.timer-fill{ height:100%; background: var(--mint); border-radius:6px; transition: width .25s linear, background .4s ease; }
.timer-fill.warn{ background: var(--marigold); }
.timer-fill.urgent{ background: var(--coral); animation: barPulse .55s ease-in-out infinite; }
@keyframes barPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }

/* ============ PROMPT LIST (player answering) ============ */
.prompt-item{
  background: var(--cream); border-radius:16px; padding:12px 14px; margin-bottom:10px;
  display:flex; align-items:center; gap:12px;
  box-shadow: var(--shadow-card);
}
.prompt-num{
  width:26px; height:26px; border-radius:8px; background:var(--ink); color:var(--marigold);
  font-family:var(--font-mono); font-weight:700; font-size:12.5px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.prompt-text{
  flex:1; font-weight:700; font-size:13.8px; color:var(--ink-text); line-height:1.25;
}
.prompt-input-wrap{ flex:1.1; min-width:0; }
.prompt-input{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 10px;
  font-size:15px; font-weight:700; color:var(--ink-text); background:#fff; outline:none;
  text-transform: none;
}
.prompt-input:focus{ border-color: var(--marigold-deep); background:#FFFCF3; }
.prompt-input.locked{ background:#F1EEE3; color:#8b8d9c; }

/* ============ REVIEW SCREEN (moderator) ============ */
.review-group{
  background: var(--ink-2); border:1px solid var(--line-lite); border-radius:18px;
  padding:14px; margin-bottom:12px;
}
.review-group h3{
  font-family:var(--font-display); font-weight:600; font-size:16px; margin:0 0 10px;
  display:flex; align-items:center; gap:8px;
}
.review-group h3 .idx{
  font-family:var(--font-mono); font-size:11px; color:var(--marigold); border:1px solid rgba(242,183,5,0.4);
  padding:2px 7px; border-radius:8px;
}
.answer-row{
  display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:12px; margin-bottom:6px;
  background: rgba(251,246,236,0.04);
  border:1.5px solid transparent;
}
.answer-row:last-child{margin-bottom:0;}
.answer-row .who{ font-size:11.5px; font-weight:800; color:rgba(251,246,236,0.45); width:64px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--font-mono);}
.answer-row .ans{ flex:1; font-weight:700; font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.answer-row .ans.empty{ color:rgba(251,246,236,0.3); font-weight:500; font-style:italic; }
.answer-row .pts{ font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--mint); width:34px; text-align:right; flex-shrink:0;}
.answer-row .actions{ display:flex; gap:5px; flex-shrink:0; }
.mini-btn{
  width:28px; height:28px; border-radius:8px; border:1.5px solid rgba(251,246,236,0.15);
  background: var(--ink-3); color:rgba(251,246,236,0.6); cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center; transition: all .15s;
}
.mini-btn.wrong-active{ background: var(--coral); border-color:var(--coral); color:#fff; }
.mini-btn.ok-active{ background:var(--mint); border-color:var(--mint-deep); color:#08301F; }
.mini-btn.star-active{ background: var(--plum); border-color:var(--plum); color:#fff; }
.mini-btn:disabled{ opacity:.3; cursor:not-allowed; }
.answer-row.is-wrong{ opacity:.55; }
.answer-row.is-wrong .ans{ text-decoration: line-through; }

.answer-row.grouped{ background: var(--grp-color, rgba(242,183,5,0.12)); border-color: var(--grp-color-b, rgba(242,183,5,0.35)); }

/* ============ SCOREBOARD ============ */
.leader-row{
  display:flex; align-items:center; gap:12px; background:var(--cream); color:var(--ink-text);
  border-radius:16px; padding:13px 14px; margin-bottom:9px; box-shadow: var(--shadow-card);
}
.leader-rank{
  font-family:var(--font-display); font-weight:700; font-size:17px; width:26px; text-align:center; color:var(--muted);
}
.leader-row.first .leader-rank{color:var(--marigold-deep);}
.leader-name{ flex:1; font-weight:800; font-size:15px; }
.leader-score{ font-family:var(--font-mono); font-weight:700; font-size:17px; color:var(--ink-text); }
.leader-medal{ font-size:20px; }

/* ============ WAIT / SPINNER ============ */
.wait-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center; gap:14px;}
.spinner{
  width:46px; height:46px; border-radius:50%;
  border:4px solid rgba(251,246,236,0.15); border-top-color: var(--marigold);
  animation: spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg);} }

/* ============ TOAST / BANNER ============ */
.banner{
  background: rgba(239,91,91,0.14); border:1px solid rgba(239,91,91,0.4); color:#ffb4b4;
  padding:12px 14px; border-radius:12px; font-size:13px; margin-bottom:14px; line-height:1.45;
}
.banner.info{ background: rgba(63,191,149,0.12); border-color: rgba(63,191,149,0.4); color:#a6f0d8; }

/* ============ MODAL ============ */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,12,24,0.68); backdrop-filter: blur(3px);
  display:flex; align-items:flex-end; justify-content:center; z-index:100;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  width:100%; max-width:520px; background: var(--ink-2); border-radius: 26px 26px 0 0;
  padding:22px 20px calc(26px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line-lite);
  max-height:80vh; overflow-y:auto;
  animation: slideUp .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
.modal-handle{ width:40px; height:4px; background:rgba(251,246,236,0.2); border-radius:4px; margin:0 auto 16px; }

.footnote{ text-align:center; color:rgba(251,246,236,0.32); font-size:11.5px; margin-top:16px; line-height:1.5; }

.round-pill{
  font-family:var(--font-mono); font-size:12px; color:var(--marigold); background: rgba(242,183,5,0.1);
  border:1px solid rgba(242,183,5,0.3); padding:6px 12px; border-radius:100px; display:inline-flex; align-items:center; gap:6px;
}

.statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
.statbox{ background:var(--ink-3); border:1px solid var(--line-lite); border-radius:14px; padding:12px 14px; }
.statbox .n{ font-family:var(--font-mono); font-weight:700; font-size:22px; color:var(--cream); }
.statbox .l{ font-size:11px; color:rgba(251,246,236,0.5); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-top:2px;}

.hidden{display:none !important;}

.modal-overlay{ position:fixed; inset:0; background:rgba(8,11,24,.72); display:flex; align-items:center;
  justify-content:center; z-index:120; padding:22px; animation: fadeIn .16s ease; }
.modal-card{ background:var(--card); border-radius:20px; padding:20px; max-width:420px; width:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.5); animation: popIn .22s ease; max-height:80vh; overflow-y:auto; }
.answer-row .ans{ cursor:pointer; }
.answer-row .ans:active{ opacity:.6; }
.mini-btn.link-active{ background:#7C5CFF; border-color:#5B3FD9; color:#fff; }

/* ===================== ANIMATION PASS ===================== */
@keyframes popIn{ 0%{ transform:scale(.7); opacity:0; } 60%{ transform:scale(1.06); opacity:1; } 100%{ transform:scale(1); } }
@keyframes slideInLeft{ from{ opacity:0; transform:translateX(-14px);} to{ opacity:1; transform:translateX(0);} }
@keyframes rowIn{ from{ opacity:0; transform:translateY(8px) scale(.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
@keyframes countPop{ 0%{ transform:scale(.5); opacity:0; } 45%{ transform:scale(1.18); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
@keyframes shakeX{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-4px);} 40%{transform:translateX(4px);} 60%{transform:translateX(-3px);} 80%{transform:translateX(3px);} }
@keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(239,91,91,0); } 50%{ box-shadow:0 0 22px 4px rgba(239,91,91,.45); } }
@keyframes floatUp{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
@keyframes confettiFall{ 0%{ transform:translateY(-12vh) rotate(0deg); opacity:1; } 100%{ transform:translateY(105vh) rotate(720deg); opacity:0; } }

function unlockAudio(){

    }
    if(audioCtx.state === "suspended") audioCtx.resume();
    const b = audioCtx.createBuffer(1,1,22050);

    s.buffer = b; s.connect(audioCtx.destination); s.start(0);
  }catch(e){}
}
function tone(freq, delay, dur, vol, type){
  if(!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.3, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+(dur||0.15));
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+(dur||0.15)+0.02);
  }catch(e){}
}

function keyToPath(key){
  const parts = key.split(":").filter(p=>p!=="");
  if(parts[0]==="sg") parts.shift();
  return "scattergo/" + parts.map(encodeURIComponent).join("/");
}
async function stGet(key){
  try{
    const snap = await db.ref(keyToPath(key)).get();
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.error("storage get failed",e); return null; }
}
async function stSet(key, val){
  try{
    await db.ref(keyToPath(key)).set(val);
    return true;
  }catch(e){ console.error("storage set failed", e); return false; }
}
async function stList(prefix){
  try{
    const clean = prefix.endsWith(":") ? prefix.slice(0,-1) : prefix;
    const snap = await db.ref(keyToPath(clean)).get();
    if(!snap.exists()) return [];
    const val = snap.val();
    const base = prefix.endsWith(":") ? prefix : prefix+":";
    return Object.keys(val).map(childKey => ({ key: base + decodeURIComponent(childKey) }));
  }catch(e){ console.error("storage list failed",e); return []; }
}

function normalize(str){
  return (str||"").trim().toLowerCase().replace(/^(a|an|the)\s+/,"").replace(/[^a-z0-9]/g,"");
}
function groupKey(str){
  let n = normalize(str);
  if(n.length > 3){
    if(/ies$/.test(n))                 n = n.replace(/ies$/, "y");
    else if(/(ses|xes|zes|ches|shes)$/.test(n)) n = n.replace(/es$/, "");
    else if(/s$/.test(n) && !/ss$/.test(n))     n = n.replace(/s$/, "");
  }
  return n;
}
function esc(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}
function pickRandom(arr, n, excludeSet){
  const pool = arr.map((v,i)=>i).filter(i => !excludeSet.has(i));
  const source = pool.length >= n ? pool : arr.map((v,i)=>i);
  const usedReset = pool.length < n;
  const chosen = [];
  const copy = source.slice();
  while(chosen.length < n && copy.length){
    const idx = Math.floor(Math.random()*copy.length);
    chosen.push(copy.splice(idx,1)[0]);
  }
  return { chosen, usedReset };
}
function pickLetter(mode, manualLetter){
  if(mode === "manual" && manualLetter) return manualLetter;
  const pool = LETTERS.filter(l => !EXCLUDED_RANDOM_LETTERS.includes(l));
  return pool[Math.floor(Math.random()*pool.length)];
}
function avatarColor(name){
  let h=0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name){
  return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "?";
}
function fmtTime(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60);
  const r = s % 60;
  return m + ":" + String(r).padStart(2,"0");
}

  S.isHost = isHostFlag;
  S.role = isHostFlag ? 'host' : 'player';

  const ref = db.ref('scattergo/' + roomCode);
  let snap = await ref.get();

  if (!snap.exists()) {
    await ref.set({
      code: roomCode,
      hostId: S.playerId,
      status: 'lobby',
      players: { [S.playerId]: { name: pName, isHost: isHostFlag } },
      createdAt: Date.now()

  } else {

      name: pName,
      isHost: isHostFlag
    });
  }

  saveIdentity();
  S.screen = isHostFlag ? 'hostLobby' : 'playerLobby';
  render();
  startMainLoop();
}

async function startRound(manualLetter){
  const meta = S.meta;
  const settings = meta.settings || {};
  const isDash = settings.gameMode === "dash";

  let letter = isDash ? "⚡" : pickLetter(settings.letterMode, manualLetter);
  let prompts = [];
  let dashLetters = [];

  if(isDash){
    const duration = settings.sprintPreset || 60;
    const numQuestions = duration === 60 ? 10 : (duration === 90 ? 15 : 20);
    const combinedBank = BANK.easy.concat(BANK.medium);
    const pickRes = pickRandom(combinedBank, numQuestions, new Set());
    prompts = pickRes.chosen.map(i => combinedBank[i]);
    dashLetters = prompts.map(() => DASH_SAFE_LETTERS[Math.floor(Math.random() * DASH_SAFE_LETTERS.length)]);
  } else {
    const diffList = BANK[settings.difficulty] || BANK.medium;
    const usedIndices = meta.usedIndices || { easy:[], medium:[], hard:[] };
    const usedSet = new Set(usedIndices[settings.difficulty] || []);
    const { chosen, usedReset } = pickRandom(diffList, 12, usedSet);
    let newUsed = usedReset ? chosen.slice() : (usedIndices[settings.difficulty] || []).concat(chosen);
    prompts = chosen.map(i => diffList[i]);
    meta.usedIndices = Object.assign({}, usedIndices, { [settings.difficulty]: newUsed });
  }

  const roundNumber = (meta.round ? meta.round.number : 0) + 1;
  const timerSecs = isDash ? (settings.sprintPreset || 60) : settings.timerSeconds;
  const now = serverNow();

  const newMeta = Object.assign({}, meta, {
    status: "playing",
    usedIndices: meta.usedIndices || { easy:[], medium:[], hard:[] },
    round: {
      number: roundNumber,
      gameMode: settings.gameMode || "classic",
      letter,
      dashLetters,
      prompts,
      startedAt: now,
      opensAt: now + COUNTDOWN_MS,
      endsAt: now + COUNTDOWN_MS + timerSecs * 1000,
      forceEnded: false,
      seq: 0
    },
    updatedAt: now
  });

  const ok = await stSet("sg:"+S.roomCode+":meta", newMeta);
  if(!ok){ toast("Couldn't start the round — check your connection and try again."); return false; }
  S.meta = newMeta;
  S.dashCurrentIdx = 0;
  S.dashSkipped = new Set();
  S.screen = "hostRound";
  lastUrgentSecond = null; playedTimeUp = false; lastCountdownNum = null;
  sRoundStart();
  render();
  return true;
}

function updateHostTimerDisplay(){
  if(!S.meta || !S.meta.round) return 0;
  const remaining = S.meta.round.endsAt - serverNow();
  const total = (S.meta.settings.timerSeconds || 90)*1000;
  const pct = Math.max(0, Math.min(100, (remaining/total)*100));
  const txtEl = document.getElementById("hostTimerText");
  const fillEl = document.getElementById("hostTimerFill");
  if(txtEl) txtEl.textContent = fmtTime(remaining);
  if(fillEl) fillEl.style.width = pct + "%";
  const urgent = remaining <= 10000;
  const warn = !urgent && pct <= 50;
  if(txtEl) txtEl.classList.toggle("urgent", urgent);
  if(fillEl){
    fillEl.classList.toggle("urgent", urgent);
    fillEl.classList.toggle("warn", warn);
    if(fillEl.parentElement) fillEl.parentElement.classList.toggle("urgent-glow", urgent);
  }
  return remaining;
}

async function buildReviewData(){
  const round = S.meta.round;
  const keys = await stList("sg:"+S.roomCode+":answers:"+round.number+":");
  const perPlayerAnswers = {};
  for(const k of keys){
    const data = await stGet(k.key || k);
    const pid = (k.key||k).split(":").pop();
    if(data) perPlayerAnswers[pid] = data.values || [];
  }
  const playerIds = Object.keys(S.players);
  const items = round.prompts.map((prompt, qi) => {
    return {
      prompt,
      dashLetter: round.dashLetters ? round.dashLetters[qi] : null,
      answers: playerIds.map(pid => {
        const raw = (perPlayerAnswers[pid] && perPlayerAnswers[pid][qi]) || "";
        return {
          playerId: pid,
          name: S.players[pid] ? S.players[pid].name : "?",
          text: raw,
          status: raw.trim() ? "pending" : "wrong",
          creative: false
        };
      })
    };
  });
  S.reviewData = { round: round.number, letter: round.letter, items };
}

function computeGroupsAndPoints(item){
  const keyOf = (a)=> a.sameAs ? ("manual:"+a.sameAs) : groupKey(a.text);
  const groups = {};
  item.answers.forEach(a=>{
    if(a.status === "correct" && a.text.trim()){
      const n = keyOf(a);
      if(!groups[n]) groups[n] = [];
      groups[n].push(a);
    }
  });
  const groupKeys = Object.keys(groups);
  const colorMap = {};
  let ci = 0;
  groupKeys.forEach(k=>{
    if(groups[k].length > 1){ colorMap[k] = GROUP_COLORS[ci % GROUP_COLORS.length]; ci++; }
  });
  item.answers.forEach(a=>{
    if(a.status !== "correct" || !a.text.trim()){ a.points = 0; a.groupColor = null; return; }
    const n = keyOf(a);
    const size = groups[n].length;
    let pts = size > 1 ? 5 : 10;
    if(a.creative) pts += 10;
    a.points = pts;
    a.groupColor = colorMap[n] || null;
  });
  return item;
}

function reviewRowHtml(a, qi, ai){
  const isWrong   = a.status === "wrong";
  const isCorrect = a.status === "correct";

  const empty = !a.text.trim();
  let styleAttr = "";
  if(a.groupColor && isCorrect){
    styleAttr = `style="--grp-color:${a.groupColor[0]}; --grp-color-b:${a.groupColor[1]};"`;
  }
  const ptsLabel = empty ? "" : (pending ? '<span style="opacity:.45;">–</span>' : ('+'+a.points));
  const linked = !!a.sameAs;
  return `
  <div class="answer-row ${isWrong?'is-wrong':''} ${a.groupColor && isCorrect ? 'grouped':''}" data-anim-i="${ai}" ${styleAttr} ${pending&&!empty?'style="opacity:.75;"':''}>
    <div class="who">${esc(a.name)}</div>
    <div class="ans ${empty?'empty':''}" data-full="${qi}:${ai}" title="Tap to see the full answer">${empty ? 'No answer' : esc(a.text)}</div>
    <div class="pts">${ptsLabel}</div>
    <div class="actions">
      <button class="mini-btn ${isCorrect?'ok-active':''}" data-right="${qi}:${ai}" ${empty?'disabled':''} title="Mark correct (tap again to undo)">✓</button>

}

function openSameAsPicker(qi, ai){
  const item = S.reviewData.items[qi];
  const me = item.answers[ai];
  const others = item.answers
    .map((a,idx)=>({a,idx}))
    .filter(o => o.idx !== ai && o.a.text.trim() && o.a.status === "correct");
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-card">
      <div class="field-label" style="margin-bottom:2px;">${esc(item.prompt)}</div>
      <div class="sub" style="margin:0 0 12px;">Which answer is <b>${esc(me.text)}</b> the same as?</div>
      ${others.length === 0
        ? `<div class="empty-note">No other accepted answers to match against.</div>`
        : others.map(o=>`
            <button class="btn btn-ghost" style="text-align:left; margin-top:6px;" data-pick="${o.idx}">
              <b>${esc(o.a.text)}</b> <span style="opacity:.6;">— ${esc(o.a.name)}</span>
            </button>`).join("")}
      ${me.sameAs ? `<button class="btn btn-ghost" style="margin-top:10px;" data-pick="none">↺ Unlink (score separately)</button>` : ""}
      <button class="btn btn-ghost" style="margin-top:10px;" data-close="1">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener("click",(e)=>{
    const pick = e.target.closest("[data-pick]");
    if(pick){
      const v = pick.getAttribute("data-pick");
      if(v === "none"){
        const myKey = me.sameAs;
        item.answers.forEach(x=>{ if(x.sameAs === myKey) delete x.sameAs; });
        delete me.sameAs;
        sUndo();
      }else{
        const target = item.answers[parseInt(v,10)];
        const key = target.sameAs || ("g"+qi+"_"+v);
        target.sameAs = key;
        me.sameAs = key;
        sJudgeRight();
      }
      close();
      rerenderReviewList();
      return;
    }
    if(e.target===overlay || e.target.getAttribute("data-close")) close();
  });
}

function updateJudgeProgress(){
  const el = document.getElementById("judgeProgress");
  if(!el || !S.reviewData) return;
  let total = 0, judged = 0;
  S.reviewData.items.forEach(it=>it.answers.forEach(a=>{
    if(!a.text.trim()) return;
    total++;
    if(a.status === "correct" || a.status === "wrong") judged++;
  }));
  if(total === 0){ el.textContent = "No answers submitted this round."; el.style.color="var(--muted)"; return; }
  const left = total - judged;
  el.textContent = left === 0
    ? `All ${total} answers judged ✓`
    : `${judged}/${total} judged · ${left} still unjudged (they'll score 0)`;
  el.style.color = left === 0 ? "#3FBF95" : "var(--muted)";
}
function rerenderReviewList(){
  S.reviewData.items.forEach(computeGroupsAndPoints);
  updateJudgeProgress();
  const listEl = document.getElementById("reviewList");
  if(listEl){
    listEl.innerHTML = S.reviewData.items.map((item, qi)=> reviewGroupHtml(item, qi)).join("");
    wireReviewListOnly();
  }
}

let scoringInFlight = false;
async function finishScoring(){
  if(scoringInFlight) return;
  let unjudged = 0;
  if(S.reviewData && S.reviewData.items){
    S.reviewData.items.forEach(it=>it.answers.forEach(a=>{
      if(a.text.trim() && a.status !== "correct" && a.status !== "wrong") unjudged++;
    }));
  }
  if(unjudged > 0){
    const ok = confirm(
      unjudged + (unjudged===1 ? " answer hasn't" : " answers haven't") + " been judged yet.\n\n" +
      "Unjudged answers score 0 points.\n\nFinish scoring anyway?"
    );
    if(!ok) return;
  }
  scoringInFlight = true;
  const btn = document.getElementById("btnFinishScoring");
  if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  
  try {
    S.reviewData.items.forEach(computeGroupsAndPoints);

    const roundPoints = {};
    Object.keys(S.players).forEach(pid => roundPoints[pid] = 0);
    const perPlayerBreakdown = {};
    Object.keys(S.players).forEach(pid => perPlayerBreakdown[pid] = []);
    S.reviewData.items.forEach(item=>{
      item.answers.forEach(a=>{
        const pts = a.text.trim() ? (a.status==="wrong" ? 0 : a.points) : 0;
        roundPoints[a.playerId] = (roundPoints[a.playerId]||0) + pts;
        perPlayerBreakdown[a.playerId].push({
          prompt: item.prompt, text: a.text, status: a.status, creative: a.creative, points: pts
        });
      });
    });

    const existingScores = (await stGet("sg:"+S.roomCode+":scores")) || {};
    Object.keys(roundPoints).forEach(pid=>{
      existingScores[pid] = (existingScores[pid]||0) + roundPoints[pid];
    });

    if(S.pendingPenalties){
      Object.entries(S.pendingPenalties).forEach(([pid,amt])=>{
        existingScores[pid] = (existingScores[pid]||0) - amt;
      });
      S.pendingPenalties = {};
    }
    await writeScores(existingScores);

    await stSet("sg:"+S.roomCode+":results:"+S.reviewData.round, {
      round: S.reviewData.round, letter: S.reviewData.letter,
      perPlayer: perPlayerBreakdown, roundPoints
    });

    const newMeta = Object.assign({}, S.meta, {
      status: "scoreboard",
      roundsPlayed: S.meta.roundsPlayed + 1,
      updatedAt: serverNow()
    });
    const ok = await stSet("sg:"+S.roomCode+":meta", newMeta);
    if(!ok){
      toast("Couldn't save scores — check your connection and try again.");
      if(btn){btn.disabled=false;btn.textContent="Finish Scoring & Show Results →";}
      scoringInFlight = false;
      return;
    }
    S.meta = newMeta;
    S.screen = "hostScoreboard";
    sScoreReveal();
    render();
  } catch(e) {
    console.error("finishScoring error:", e);
    toast("An error occurred while saving scores. Please try again.");
    if(btn){ btn.disabled = false; btn.textContent = "Finish Scoring & Show Results →"; }
  } finally {
    scoringInFlight = false;
  }
}

function returnToLauncher() {

  clearIdentity();

  const urlParams = new URLSearchParams(window.location.search);

  if (isHost && typeof db !== 'undefined' && room) {
    db.ref(`master_rooms/${room}`).update({
      status: 'LOBBY',
      launchedGame: null

  }

  window.location.href = `index.html?room=${room}&name=${encodeURIComponent(name)}&isHost=${isHost}`;

async function joinFromLauncher(roomCode, pName, pId, isHostFlag) {
  S.roomCode = roomCode;
  S.playerName = pName;
  S.playerId = pId || ('p_' + Math.random().toString(36).substr(2, 9));
  S.isHost = isHostFlag;
  S.role = isHostFlag ? 'host' : 'player';

  const ref = db.ref('scattergo/' + roomCode);
  let snap = await ref.get();

  if (!snap.exists()) {
    // Room shell created from Super App Launcher
    await ref.set({
      code: roomCode,
      hostId: S.playerId,
      status: 'lobby',
      players: { [S.playerId]: { name: pName, isHost: isHostFlag } },
      createdAt: serverNow()
    });
  } else {
    await ref.child('players/' + S.playerId).set({
      name: pName,
      isHost: isHostFlag
    });
  }

  saveIdentity();

  // ROUTING FIX: Host lands directly on Game Setup Screen; Players land in Lobby
  if (isHostFlag) {
    setupDraft.hostName = pName;
    S.screen = 'hostSetup';
  } else {
    S.screen = 'playerLobby';
  }

  render();
  startMainLoop();
}

function launchConfetti(n){
  try{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = ["#F2B705","#3FBF95","#EF5B5B","#7C5CFF","#4EA8DE"];
    for(let i=0;i<(n||60);i++){
      const el = document.createElement("div");
      el.className = "confetti-piece";
      el.style.left = Math.random()*100 + "vw";
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = (2.2 + Math.random()*1.8) + "s";
      el.style.animationDelay = (Math.random()*0.9) + "s";
      document.body.appendChild(el);
      setTimeout(()=>{ if(el.parentNode) el.remove(); }, 5200);
    }
  }catch(e){}
}

function animateCount(el, to, dur){
  if(!el) return;
  try{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      el.textContent = to; return;
    }
    const from = 0, t0 = Date.now(), ms = dur || 900;
    let lastBeep = -1;
    const step = ()=>{
      const p = Math.min(1, (Date.now()-t0)/ms);
      const eased = 1 - Math.pow(1-p, 3);
      const val = Math.round(from + (to-from)*eased);
      el.textContent = val;
      const beepBucket = Math.floor(p*6);
      if(beepBucket !== lastBeep && p < 1){ lastBeep = beepBucket; sTally(); }
      if(p < 1) requestAnimationFrame(step);
      else el.textContent = to;
    };
    requestAnimationFrame(step);
  }catch(e){ el.textContent = to; }
}

function wirePlayerRound(){
  const isDash = S.meta && S.meta.round && S.meta.round.gameMode === "dash";

  if(isDash){
    const dashInput = document.getElementById("dashInput");
    if(dashInput){
      setTimeout(()=>{ try{ dashInput.focus(); }catch(e){} }, 50);

      dashInput.addEventListener("input", ()=>{
        const idx = parseInt(dashInput.getAttribute("data-idx"),10);
        S.localAnswers[idx] = dashInput.value;
        queueDraftSave();
      });

      const findNextDashIdx = (fromIdx)=>{
        const total = S.meta.round.prompts.length;
        for(let i = fromIdx + 1; i < total; i++){
          if(!(S.localAnswers[i]||"").trim()) return i;
        }
        for(let i = 0; i < fromIdx; i++){
          if(!(S.localAnswers[i]||"").trim()) return i;
        }
        return (fromIdx + 1) % total;
      };

      const handleAdvance = (isPass)=>{
        const idx = parseInt(dashInput.getAttribute("data-idx"),10);
        if(isPass){
          S.dashSkipped = S.dashSkipped || new Set();
          S.dashSkipped.add(idx);
        } else {
          S.localAnswers[idx] = dashInput.value;
          if(S.dashSkipped) S.dashSkipped.delete(idx);
          queueDraftSave();
        }
        S.dashCurrentIdx = findNextDashIdx(idx);
        render();
      };

      dashInput.addEventListener("keydown", (e)=>{
        if(e.key === "Enter"){
          e.preventDefault();
          handleAdvance(false);
        }
      });

      const btnNext = document.getElementById("btnDashNext");
      if(btnNext) btnNext.onclick = ()=> handleAdvance(false);

      const btnPass = document.getElementById("btnDashPass");
      if(btnPass) btnPass.onclick = ()=> handleAdvance(true);
    }
    return;
  }

  root.querySelectorAll(".prompt-input").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const idx = parseInt(inp.getAttribute("data-idx"),10);
      S.localAnswers[idx] = inp.value;
      queueDraftSave();
    });
  });
  const btn = document.getElementById("btnSubmitEarly");
  if(btn) btn.onclick = ()=> submitPlayerAnswers(false);
}

async function submitPlayerAnswers(auto){

    if(!ok) await new Promise(r=>setTimeout(r, 400*(attempt+1)));
  }
  if(!ok){

    toast("Couldn't send answers — retrying…");

  }
  return ok;

let lastCountdownNum = null;
function tickCountdown(){
  const round = S.meta && S.meta.round;
  if(!round || !round.opensAt) return;
  const msLeft = round.opensAt - serverNow();
  if(msLeft <= 0){
    lastCountdownNum = null;
    clearTimerLoop();
    sGo();
    render();
    return;
  }
  const n = Math.min(3, Math.ceil(msLeft/1000));
  const el = document.getElementById("countdownNum");
  if(el) el.textContent = (msLeft <= 400) ? "GO!" : n;
  if(n !== lastCountdownNum){
    lastCountdownNum = n;
    if(n <= 3 && n >= 1) sCountdownTick();
  }
}

let lastUrgentSecond = null;
let playedTimeUp = false;
function playUrgentTicks(remainingMs){
  if(remainingMs == null) return;
  const secs = Math.ceil(remainingMs/1000);
  if(remainingMs > 0 && secs <= 10){
    if(secs !== lastUrgentSecond){ lastUrgentSecond = secs; sUrgentTick(); }
  }
  if(remainingMs <= 0 && !playedTimeUp){ playedTimeUp = true; sTimeUp(); }
}
function updatePlayerTimerDisplay(){
  if(!S.meta || !S.meta.round) return 0;
  const remaining = S.meta.round.endsAt - serverNow();
  const total = (S.meta.settings.timerSeconds || 90)*1000;
  const pct = Math.max(0, Math.min(100, (remaining/total)*100));
  const txtEl = document.getElementById("playerTimerText");
  const fillEl = document.getElementById("playerTimerFill");
  if(txtEl) txtEl.textContent = fmtTime(remaining);
  if(fillEl) fillEl.style.width = pct + "%";
  const urgent = remaining <= 10000;
  const warn = !urgent && pct <= 50;
  if(txtEl) txtEl.classList.toggle("urgent", urgent);
  if(fillEl){
    fillEl.classList.toggle("urgent", urgent);
    fillEl.classList.toggle("warn", warn);
    if(fillEl.parentElement) fillEl.parentElement.classList.toggle("urgent-glow", urgent);
  }
  return remaining;
}

let pollInFlight = false;
let scoresWrittenAt = 0;
async function writeScores(scoresObj){
  scoresWrittenAt = Date.now();
  S.scores = scoresObj;
  const ok = await stSet("sg:"+S.roomCode+":scores", scoresObj);
  scoresWrittenAt = Date.now();
  return ok;
}
async function pollTick(){
  if(!S.roomCode || pollInFlight) return;
  pollInFlight = true;
  const pollStartedAt = Date.now();
  try{
    const [playerKeys, meta, scores] = await Promise.all([
      stList("sg:"+S.roomCode+":players:"),
      stGet("sg:"+S.roomCode+":meta"),
      stGet("sg:"+S.roomCode+":scores")
    ]);
    storageOK = true;
    if(scores && pollStartedAt >= scoresWrittenAt) S.scores = scores;

    const newPlayers = {};
    for(const k of playerKeys){
      const key = k.key || k;
      const pid = key.split(":").pop();
      if(S.players[pid]){ newPlayers[pid] = S.players[pid]; continue; }
      const data = await stGet(key);
      if(data) newPlayers[pid] = data;
    }
    const playersChanged = JSON.stringify(Object.keys(newPlayers).sort()) !== JSON.stringify(Object.keys(S.players).sort());
    S.players = newPlayers;

    if(!meta) return;

    if(S.meta && meta.updatedAt < S.meta.updatedAt) {}
    else {
      const prevStatus = S.meta ? S.meta.status : null;
      const prevRoundNum = S.meta && S.meta.round ? S.meta.round.number : -1;
      S.meta = meta;

      if(meta.status === "playing" && meta.round && (S.screen === "hostRound")){
        const keys = await stList("sg:"+S.roomCode+":answers:"+meta.round.number+":");
        S.submittedCount = keys.length;
      }

      if(meta.status === "playing" && meta.round && !meta.round._transitioning){
        const over = meta.round.forceEnded || serverNow() >= meta.round.endsAt;
        if(over){ await tryClaimRoundEnd(meta); }
      }

      if(S.role === "host"){
        handleHostPoll(prevStatus, playersChanged);
      } else {
        await handlePlayerPoll(prevStatus, prevRoundNum, playersChanged);
      }
    }
  }catch(e){
    console.error("poll failed", e);
    storageOK = false;
  }finally{
    pollInFlight = false;
  }
}

async function tryClaimRoundEnd(meta){
  if (!S.roomCode || !meta || !meta.round) return;
  try{
    const seqRef = db.ref("scattergo/"+S.roomCode+"/meta/round/seq");
    const expected = meta.round.seq || 0;
    const res = await seqRef.transaction(cur=>{
      const now = (cur==null) ? 0 : cur;
      if(now !== expected) return;
      return now + 1;
    });
    if(!res || !res.committed) return;

    const newMeta = Object.assign({}, meta, {
      status: "reviewing",
      round: Object.assign({}, meta.round, { seq: expected+1 }),
      updatedAt: serverNow()
    });
    const ok = await stSet("sg:"+S.roomCode+":meta", newMeta);
    if(ok) {
      S.meta = newMeta;
    } else {
      console.warn("Failed to set meta during round-end claim; retrying...");
    }
  }catch(e){ console.error("round-end claim failed", e); }
}

function handleHostPoll(prevStatus, playersChanged){
  if(S.screen === "hostLobby" && playersChanged){ sJoin(); render(); }
  if(S.screen === "hostRound"){
    updateHostTimerDisplay();
    const el = document.getElementById("submittedCount");
    if(el) el.textContent = (S.submittedCount||0) + "/" + Object.keys(S.players).length;
  }
  if(S.meta.status === "reviewing" && S.screen === "hostRound" && !S.enteringReview){
    S.enteringReview = true;
    enterReviewScreen().finally(()=>{ S.enteringReview = false; });
  }
}

async function enterReviewScreen(){
  clearTimerLoop();
  await buildReviewData();
  S.screen = "hostReview";
  render();
}

async function handlePlayerPoll(prevStatus, prevRoundNum, playersChanged){
  const status = S.meta.status;
  const round = S.meta.round;

  if(status === "playing" && round && round.number !== S.lastRoundNumber){
    S.lastRoundNumber = round.number;
    S.localAnswers = new Array(round.prompts.length).fill("");
    S.submitted = false;
    S.dashCurrentIdx = 0;
    S.dashSkipped = new Set();
    lastUrgentSecond = null; playedTimeUp = false; lastCountdownNum = null;
    sRoundStart();
    S.screen = "playerRound";
    render();
    return;
  }
  if(status === "playing" && S.screen === "playerRound"){
    return;
  }
  if(status === "reviewing"){
    if(!S.submitted && S.localAnswers && S.localAnswers.some(v=>v && v.trim())){
      S.submitted = true;
      saveAnswers(true, false);
    }
    if(S.screen !== "playerWait"){ S.screen = "playerWait"; render(); }
    return;
  }
  if(status === "scoreboard"){
    if(S.screen !== "playerResults" || !S.lastResults || S.lastResults.round !== round.number){
      const results = await stGet("sg:"+S.roomCode+":results:"+round.number);
      S.lastResults = results;
      S.screen = "playerResults";
      render();
    }
    return;
  }
  if(status === "ended"){
    clearIdentity();
    if(S.screen !== "playerFinal"){ S.screen = "playerFinal"; render(); }
    return;
  }
  if(status === "lobby"){
    if(S.screen !== "playerLobby" || playersChanged){
      if(playersChanged && S.screen === "playerLobby") sJoin();
      S.screen = "playerLobby"; render();
    }
  }
}

const wireMap = {
  home: wireHome,
  hostSetup: wireHostSetup,
  hostLobby: wireHostLobby,
  hostRound: null,
  hostReview: wireHostReview,
  hostScoreboard: wireHostScoreboard,
  hostFinal: wireFinal,
  playerJoin: wirePlayerJoin,
  playerLobby: null,
  playerRound: null,
  playerWait: null,
  playerResults: null,
  playerFinal: wireFinal,
};
function render(){
  clearTimerLoop();
  let html = "";
  switch(S.screen){
    case "home": html = screenHome(); break;
    case "hostSetup": html = screenHostSetup(); break;
    case "hostLobby": html = screenHostLobby(); break;
    case "hostRound": html = screenHostRound(); break;
    case "hostReview": html = screenHostReview(); break;
    case "hostScoreboard": html = screenHostScoreboard(); break;
    case "hostFinal": html = screenFinal(true); break;
    case "playerJoin": html = screenPlayerJoin(); break;
    case "playerLobby": html = screenPlayerLobby(); break;
    case "playerRound": html = screenPlayerRound(); break;
    case "playerWait": html = screenPlayerWait(); break;
    case "playerResults": html = screenPlayerResults(); break;
    case "playerFinal": html = screenFinal(false); break;
    default: html = screenHome();
  }
  root.innerHTML = html;
  attachGlobalHandlers();
  const wireFn = wireMap[S.screen];
  if(wireFn) wireFn();
  if(S.screen === "playerRound") startPlayerRoundTimer();
  if(S.screen === "hostRound") startHostRoundTimer();
};

async function boot(){
  await checkStorage();
  const identity = loadIdentity();
  if(identity && identity.roomCode && identity.playerId){
    const meta = await stGet("sg:"+identity.roomCode+":meta");
    if(meta){
      if(meta.status === "ended"){
        clearIdentity();
        render();
        return;
      }
      S.role = identity.role;
      S.roomCode = identity.roomCode;
      S.playerId = identity.playerId;
      S.playerName = identity.playerName;
      S.meta = meta;
      const scores = await stGet("sg:"+identity.roomCode+":scores");
      if(scores) S.scores = scores;
      const playerKeys = await stList("sg:"+identity.roomCode+":players:");
      for(const k of playerKeys){
        const key = k.key || k;
        const pid = key.split(":").pop();
        const data = await stGet(key);
        if(data) S.players[pid] = data;
      }
      if(identity.role === "host"){
        if(meta.status === "lobby") S.screen = "hostLobby";
        else if(meta.status === "playing") S.screen = "hostRound";
        else if(meta.status === "reviewing"){ await buildReviewData(); S.screen = "hostReview"; }
        else if(meta.status === "scoreboard") S.screen = "hostScoreboard";
        else if(meta.status === "ended"){ clearIdentity(); S.screen = "hostFinal"; }
        else S.screen = "hostLobby";
      } else {
        S.lastRoundNumber = meta.round ? meta.round.number : -1;
        if(meta.status === "playing"){
          S.localAnswers = new Array((meta.round.prompts||[]).length).fill("");
          S.dashCurrentIdx = 0;
          S.dashSkipped = new Set();
          const existing = await stGet("sg:"+identity.roomCode+":answers:"+meta.round.number+":"+identity.playerId);
          if(existing){ S.localAnswers = existing.values.slice(); S.submitted = true; }
          S.screen = "playerRound";
        } else if(meta.status === "reviewing"){ S.screen = "playerWait"; }
        else if(meta.status === "scoreboard"){
          S.lastResults = await stGet("sg:"+identity.roomCode+":results:"+meta.round.number);
          S.screen = "playerResults";
        } else if(meta.status === "ended"){ clearIdentity(); S.screen = "playerFinal"; }
        else { S.screen = "playerLobby"; }
      }
      render();
      startMainLoop();
      return;
    } else {
      clearIdentity();
    }
  }
  render();
}

boot();

})();
</script>
